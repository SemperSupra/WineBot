name: winebot-process-receipt-regression
on:
  push:
    branches:
      - qualification/process-receipt-regression-20261029
permissions:
  contents: read
jobs:
  process:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_wine_events_process_rdte.py' -v
