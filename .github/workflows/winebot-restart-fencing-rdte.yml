name: WineBot restart fencing synthetic qualification
on:
  push:
    branches:
      - qualification/epoch-restart-fencing-20261027
permissions:
  contents: read
jobs:
  restart-fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_wine_restart_fencing_rdte.py' -q
