name: Disposable User-State Backup and Restore RDTE
on:
  pull_request:
    paths:
      - '.github/workflows/disposable-backup-restore-rdte.yml'
      - 'scripts/ci/qualify-volume-backup-restore.sh'
  push:
    branches: ['rdte/volume-restore-guard-fix-20261116']
    paths:
      - '.github/workflows/disposable-backup-restore-rdte.yml'
      - 'scripts/ci/qualify-volume-backup-restore.sh'
permissions:
  contents: read
concurrency:
  group: layer-backup-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  synthetic-six-volume-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Checkout exact public PR code without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Source syntax and destructive-operation scope
        run: |
          set -euo pipefail
          bash -n scripts/ci/qualify-volume-backup-restore.sh
          grep -q '^prefix="winebot-recovery-' scripts/ci/qualify-volume-backup-restore.sh
          grep -q 'archive_integrity_negative' scripts/ci/qualify-volume-backup-restore.sh
          grep -q 'backup_volume="$prefix-snapshots"' scripts/ci/qualify-volume-backup-restore.sh
          ! grep -q 'rm -rf' scripts/ci/qualify-volume-backup-restore.sh
      - name: Fully disposable checksum archive and nonroot recovery
        run: bash scripts/ci/qualify-volume-backup-restore.sh
      - name: Report only synthetic result
        if: success()
        run: echo 'LAYER_BACKUP_RDTE stage=qualified_synthetic_replay'
