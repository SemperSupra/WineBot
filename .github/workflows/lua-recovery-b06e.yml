name: Public Lua separate evidence stream and repeated observation comparison
on:
  push:
    branches: [rdte/synthetic-analysis-b05-20261125]
    paths: [.github/workflows/lua-recovery-b06e.yml]
permissions:
  contents: read
  statuses: write
jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Bind public execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = SemperSupra/WineBot
          test "$GITHUB_REF" = refs/heads/rdte/synthetic-analysis-b05-20261125
          mkdir -p receipts lab
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=rdte/lua-recovery-b06e -f description='Synthetic experiment started' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - name: Build unmodified public Lua and collect runtime observations
        run: |
          set -euo pipefail
          command -v gdb || { sudo apt-get update -qq; sudo apt-get install -y -qq gdb; }
          curl -fsSL --max-time 60 https://www.lua.org/ftp/lua-5.4.9.tar.gz -o lab/lua.tar.gz
          echo '2335b6c582a52654f94612bf10d2f4672805d05329aa6568b1d8cd9e5c6fb8e6  lab/lua.tar.gz' | sha256sum -c -
          tar -xzf lab/lua.tar.gz -C lab
          make -C lab/lua-5.4.9 -j2 linux MYCFLAGS='-g -fno-pie' MYLDFLAGS=-no-pie > receipts/build.log 2>&1
          cp lab/lua-5.4.9/src/lua lab/oracle
          cp lab/oracle lab/subject
          strip --strip-all lab/subject
          readelf -h lab/subject > receipts/elf.txt
          grep -q 'Type:.*EXEC' receipts/elf.txt
          sha256sum lab/lua.tar.gz lab/oracle lab/subject > receipts/build.sha256
          cc --version > receipts/compiler.txt
          gdb --version > receipts/gdb-version.txt
          objdump -d -j .text lab/subject > receipts/static.txt
          # Exact public B06c A arm observed model; do not rebind by address on another build.
          echo 'b6e4bf98ce0908ece441cfb5949140c44ce58ffae32c352c482449a6c1bf5cc6  lab/subject' | sha256sum -c -
          cat > receipts/prior-edges.json <<'JSON'
          [[4238147,4218896],[4238147,4237504],[4238147,4237776],[4238147,4242336],[4238147,4248976],[4238147,4280144],[4241362,4345360],[4242048,4216320],[4242048,4345264],[4242048,4345584],[4242048,4346256],[4242048,4346944],[4242048,4348032],[4242048,4348144],[4242048,4349280],[4242048,4349616],[4242048,4349728],[4242048,4350224],[4242048,4350688],[4242048,4351184],[4242048,4356080],[4242048,4359280],[4242048,4359648],[4242048,4360928],[4242048,4361120],[4242048,4361200],[4242048,4361424],[4242048,4361872],[4242048,4362384],[4242048,4363440],[4242048,4363696],[4242048,4365456],[4242048,4365792],[4242048,4366208],[4242048,4366784],[4242048,4369072],[4242048,4370768],[4242048,4373872],[4242048,4374816],[4242048,4377712],[4242048,4381696],[4242048,4383728],[4242048,4385104],[4242048,4389280],[4242048,4391472],[4242048,4391936],[4242048,4393008],[4242048,4395744],[4280595,4318128],[4361011,4356624]]
          JSON
          curl -fsSL --max-time 60 https://www.lua.org/tests/lua-5.4.9-tests.tar.gz -o lab/tests.tar.gz
          echo '7d971845f545ffc09fbb3128a86b2c6524161c70d0fdf0154a16e8c00c343fca  lab/tests.tar.gz' | sha256sum -c -
          sha256sum lab/tests.tar.gz > receipts/tests.sha256
          cat > lab/suite-witness.py <<'PY'
          import gdb,json,re,os
          mode=os.environ["OBS_MODE"]
          root=os.environ["OBS_ROOT"]
          prior=set(tuple(x) for x in json.load(open(root+"/receipts/prior-edges.json")))
          knownsites={p for p,t in prior}
          sites={}
          for line in open(root+"/receipts/static.txt"):
              m=re.search(r"^\s*([0-9a-f]+):.*\bcallq?\s+\*%([a-z0-9]+)\s*$",line)
              if m:sites[int(m.group(1),16)]=m.group(2)
          assert len(sites)==15 and knownsites<=set(sites)
          selected={p:r for p,r in sites.items() if mode!="gap" or p not in knownsites}
          total=0;limit=1500;counts={};last=None;censored=set();exits=[]
          out=open(os.environ["OBS_FILE"],"x",encoding="ascii")
          def emit(v):
              out.write(json.dumps(v,separators=(",",":"))+"\n")
          def on_exit(event):
              exits.append(getattr(event,"exit_code",None))
          gdb.events.exited.connect(on_exit)
          class Witness(gdb.Breakpoint):
              def __init__(self,pc,reg):
                  super().__init__("*"+hex(pc),internal=True)
                  self.pc=pc;self.reg=reg
              def stop(self):
                  global last,total
                  pc=int(gdb.parse_and_eval("$pc"))
                  assert pc==self.pc and total<limit
                  t=int(gdb.parse_and_eval("$"+self.reg))
                  total+=1;counts[pc]=counts.get(pc,0)+1
                  emit({"seq":total,"pc":pc,"target":t})
                  last=self
                  return True
          bp=[Witness(p,r) for p,r in selected.items()]
          gdb.execute("set disable-randomization off")
          gdb.execute("run",to_string=False)
          while gdb.selected_inferior().pid:
              assert last is not None,"unexpected non-breakpoint stop"
              if total>=limit:
                  for x in bp:
                      if x.enabled:
                          x.enabled=False;censored.add(x.pc)
              elif mode=="stratified" and counts[last.pc]>=limit//len(sites):
                  last.enabled=False;censored.add(last.pc)
              last=None
              gdb.execute("continue",to_string=False)
          emit({"mode":mode,"selected":sorted(selected),"hits":total,"counts":counts,"censored":sorted(censored),"exits":exits})
          out.close()
          PY
          cp lab/suite-witness.py receipts/suite-witness.py
          cat > lab/stream_parser.py <<'PY'
          import json,collections
          def require(ok,why):
              if not ok: raise ValueError(why)
          def unique(pairs):
              d={}
              for k,v in pairs:
                  require(k not in d,"duplicate key")
                  d[k]=v
              return d
          def integer(v):
              return type(v) is int and 0<=v<2**64
          def parse(data,mode,selected,limit=1500,per_site=100):
              require(0<len(data)<=512*1024 and data.endswith(b"\n"),"size or truncated record")
              rows=data.decode("ascii").splitlines()
              require(2<=len(rows)<=limit+1,"missing/overflow")
              values=[json.loads(l,object_pairs_hook=unique) for l in rows]
              counts=collections.Counter();edges=set()
              for i,v in enumerate(values[:-1],1):
                  require(type(v) is dict and set(v)=={"seq","pc","target"},"event shape")
                  require(all(integer(v[k]) for k in v) and v["seq"]==i and v["pc"] in selected,"event identity")
                  counts[v["pc"]]+=1;edges.add((v["pc"],v["target"]))
              s=values[-1]
              require(type(s) is dict and set(s)=={"mode","selected","hits","counts","censored","exits"},"terminal shape")
              require(s["mode"]==mode and s["selected"]==sorted(selected) and all(integer(x) for x in s["selected"]),"mode/sites")
              require(integer(s["hits"]) and s["hits"]==len(values)-1,"hit count")
              require(type(s["counts"]) is dict and all(integer(v) for v in s["counts"].values()) and s["counts"]=={str(k):v for k,v in counts.items()},"per-site count")
              require(type(s["exits"]) is list and len(s["exits"])==1 and integer(s["exits"][0]) and s["exits"][0]==0,"inferior exit")
              expected=set(selected) if s["hits"]==limit else ({p for p,n in counts.items() if n==per_site} if mode=="stratified" else set())
              require(type(s["censored"]) is list and all(integer(p) for p in s["censored"]) and s["censored"]==sorted(expected),"censoring")
              require(mode!="stratified" or max(counts.values())<=per_site,"per-site budget")
              return edges,s
          if __name__=="__main__":
              import copy
              a={"seq":1,"pc":1,"target":3};s={"mode":"broad","selected":[1],"hits":1,"counts":{"1":1},"censored":[],"exits":[0]}
              def encode(rows):return ("\n".join(json.dumps(x) for x in rows)+"\n").encode()
              good=encode([a,s])
              assert parse(good,"broad",{1})[0]=={(1,3)}
              bad=[b"",good[:-1],encode([a]),encode([dict(a,seq=2),s]),encode([a,dict(s,hits=2)]),encode([a,dict(s,exits=[1])]),encode([dict(a,pc=2),s]),encode([a,dict(s,censored=[1])]),encode([dict(a,target=True),s]),b'{"seq":1,"seq":1,"pc":1,"target":3}\n'+encode([s]),b'WITNESS [1,3]\n'+encode([s])]
              for b in bad:
                  try:parse(b,"broad",{1})
                  except (ValueError,TypeError,AttributeError):continue
                  raise AssertionError("accepted invalid stream")
              print("PARSER_CONTROLS 1 positive 11 rejected")
          PY
          cp lab/stream_parser.py receipts/stream_parser.py
          cat > lab/suite-compare.py <<'PY'
          import pathlib,os,subprocess,json,re,time,shutil
          from stream_parser import parse
          L=pathlib.Path("lab").resolve();R=pathlib.Path("receipts").resolve()
          subject=L/"subject";prior=set(map(tuple,json.loads((R/"prior-edges.json").read_text())))
          sites={int(m.group(1),16) for line in (R/"static.txt").read_text().splitlines() if (m:=re.search(r"^\s*([0-9a-f]+):.*\bcallq?\s+\*%([a-z0-9]+)\s*$",line))}
          assert len(sites)==15
          m=re.search(r"^\s*\d+\s+\.text\s+([0-9a-f]+)\s+([0-9a-f]+)",subprocess.check_output(["objdump","-h",str(subject)],text=True),re.M);assert m
          size,lo=map(lambda x:int(x,16),m.groups());hi=lo+size
          results=[]
          orders=[("broad","gap","stratified"),("gap","stratified","broad"),("stratified","broad","gap")]
          for rep,order in enumerate(orders,1):
              for mode in ("baseline",)+order:
                  label=f"{rep}-{mode}"
                  dest=L/("suite-"+label);dest.mkdir()
                  subprocess.run(["tar","-xzf",str(L/"tests.tar.gz"),"-C",str(dest)],check=True)
                  cwd=dest/"lua-5.4.9-tests";assert (cwd/"all.lua").is_file()
                  args=[str(subject),"-e","_U=true","all.lua"]
                  stream=R/(label+".jsonl")
                  env={"PATH":"/usr/bin:/bin","LC_ALL":"C","HOME":str(dest),"TMPDIR":str(dest),"OBS_MODE":mode,"OBS_ROOT":str(L.parent),"OBS_FILE":str(stream)}
                  if mode!="baseline":args=["gdb","-nx","-q","-batch","-x",str(L/"suite-witness.py"),"--args"]+args
                  path=R/(label+".log");start=time.monotonic_ns()
                  try:
                      with path.open("wb") as f:
                          cp=subprocess.run(args,cwd=cwd,env=env,stdout=f,stderr=subprocess.STDOUT,timeout=45)
                      rc=cp.returncode
                  except subprocess.TimeoutExpired:rc=124
                  elapsed=time.monotonic_ns()-start
                  assert path.stat().st_size<=2*1024*1024,"log cap"
                  log=path.read_text(errors="replace")
                  result={"rep":rep,"mode":mode,"exit":rc,"elapsed_ns":elapsed,"log_bytes":path.stat().st_size,"status":"PASS" if rc==0 and "final OK !!!" in log.splitlines() else "FAIL"}
                  if mode!="baseline":
                      try:
                          selected=sites-{p for p,t in prior} if mode=="gap" else sites
                          raw,s=parse(stream.read_bytes(),mode,selected)
                          edges={e for e in raw if lo<=e[0]<hi and lo<=e[1]<hi}
                          result.update({"edges":sorted(edges),"new_edges":len(edges-prior),"distinct_sites":len({p for p,t in edges}),"external_edges":len(raw-edges),"hits":s["hits"],"stream_bytes":stream.stat().st_size,"censored":s["censored"]})
                      except (ValueError,OSError,TypeError,AttributeError) as e:
                          result.update(status="INCOMPLETE",reason=type(e).__name__+": "+str(e)[:160])
                  results.append(result)
                  print(json.dumps({k:v for k,v in result.items() if k!="edges"}),flush=True)
                  shutil.rmtree(dest)
          symbols=subprocess.check_output(["nm","-S","--defined-only",str(L/"oracle")],text=True)
          (R/"oracle-symbols.txt").write_text(symbols)
          entries={int(f[0],16) for line in symbols.splitlines() if len(f:=line.split())==4 and f[2] in ("T","t","W","w")}
          for r in results:
              if "edges" in r:r["symbol_entry_edges"]=sum(t in entries for p,t in r["edges"])
          (R/"suite-comparison.json").write_text(json.dumps({"prior_edges":len(prior),"results":results,"classification":"controlled upstream basic suite; repeated paired policies, separate unauthenticated observer stream; main inferior only"},indent=2))
          assert len(results)==12 and all(r["status"]=="PASS" for r in results),"incomplete or failing arm"
          PY
          cp lab/suite-compare.py receipts/suite-compare.py
          python3 lab/stream_parser.py
          ulimit -c 0
          python3 lab/suite-compare.py
      - name: Bound retained evidence
        if: always()
        run: |
          set -euo pipefail
          if test -d receipts && test "$(du -sb receipts | cut -f1)" -gt 10485760; then
            printf 'Artifact size exceeded 10 MiB; original evidence not retained\n' > receipts-size-failure.txt
            find receipts -type f -printf '%s %P\n' >> receipts-size-failure.txt
            rm -rf receipts
            mkdir receipts
            mv receipts-size-failure.txt receipts/
            exit 1
          fi
      - name: Retain bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lua-recovery-b06e
          path: receipts/
          retention-days: 7
      - name: Report terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = SemperSupra/WineBot
          test "$GITHUB_REF" = refs/heads/rdte/synthetic-analysis-b05-20261125
          case "$JOB_RESULT" in success) state=success;; failure) state=failure;; *) state=error;; esac
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=rdte/lua-recovery-b06e -f description='Synthetic analysis wrapper result' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
