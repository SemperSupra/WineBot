name: VirtIO bounded batch comparison E02
on:
  push:
    branches: [rdte/synthetic-analysis-b05-20261125]
    paths: [.github/workflows/upip-virtio-batch-e02.yml]
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Recover exact public recording
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/upip-e02"
          cd "$RUNNER_TEMP/upip-e02"
          gh api repos/SemperSupra/WineBot/actions/artifacts/15005235158/zip > v12.zip
          echo '63c3d6282b08c66b857d68df76d54925d4a4c5d8da7d889e2ba796356c2832fd  v12.zip' | sha256sum -c -
      - name: Build and compare pinned runtime on recorded device events
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/upip-e02"
          trap 'cd /; rm -rf "$RUNNER_TEMP/upip-e02"' EXIT
          pin=5755157bf4341be69af2afcd5175997f02303669
          git init -q ubpf
          git -C ubpf fetch --depth=1 https://github.com/iovisor/ubpf.git "$pin"
          git -C ubpf checkout -q --detach FETCH_HEAD
          test "$(git -C ubpf rev-parse HEAD)" = "$pin"
          test "$(git -C ubpf hash-object vm/inc/ubpf.h)" = ab8b94657772edae6515a813d5a12654f2992822
          test "$(git -C ubpf hash-object LICENSE.txt)" = d645695673349e3947e8e5ae42332d0ac3164cd7
          cmake -S ubpf -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DUBPF_SKIP_EXTERNAL=ON -DUBPF_ENABLE_TESTS=OFF -DUBPF_INSTALL_GIT_HOOKS=OFF
          cmake --build build --target ubpf -j 2
          cat > extract.py <<'PY'
          import hashlib,re,zipfile,pathlib
          sha=lambda b:hashlib.sha256(b).hexdigest()
          pat=re.compile(rb'virtqueue_host_advance queue (0|1) packed (0|1) ordered (0) used (0|[1-9][0-9]*)->(0|[1-9][0-9]*) wrap (0|1)->(0|1) inuse (0|[1-9][0-9]*)->(0|[1-9][0-9]*)\n')
          pins=[
            ('split',0,'b7ea805ee869d9a872bc0338497e328de5f65bca7dfeece716c62be2dc44fc3c','d50c73fe1218d37ad66138199b740e2d2d1bb742e62649f7abd1d1c86106f243','e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855',0),
            ('packed',1,'b6719c122336e5eb641c6f8b50b1654fe6c50415c93375429f3b598983ec7267','96ab1791d1be9d60a843cd544ea8c2ed6de296b16ac13a9fd7fa70c068bea1fb','aca386a3acc93907874390b8f1118233969a4fd885b9f69238fb2a83a7b512a7',31)]
          assert all(re.fullmatch(r'[0-9a-f]{64}', h) for pin in pins for h in pin[2:5])
          with zipfile.ZipFile('v12.zip') as z:
            assert len(z.namelist())==87 and z.testzip() is None
            for name,mode,rawhash,scopehash,outhash,count in pins:
              raw=z.read(f'candidate-{name}-on.trace')
              assert sha(raw)==rawhash
              rows=[]; scoped=[]; selected=[]
              for line in raw.splitlines(keepends=True):
                if not line.startswith(b'virtqueue_host_advance'):continue
                m=pat.fullmatch(line)
                assert m
                q,p,o,a,b,c,d,e,g=map(int,m.groups())
                assert p==mode and a<=65535 and b<=65535 and e<2**32 and g<2**32 and (p or c==d) and (a,c,e)!=(b,d,g)
                scoped.append(line)
                rows.append(f'{q} {a} {b} {c} {d}\n')
                if c!=d:selected.append(f'{len(rows)} {q} {a} {b} {c} {d}\n')
              assert len(rows)==8268 and len(selected)==count
              assert sha(b''.join(scoped))==scopehash
              out=''.join(selected).encode()
              assert sha(out)==outhash
              pathlib.Path(name+'.rows').write_text(''.join(rows))
              pathlib.Path(name+'.expected').write_bytes(out)
              print(f'INPUT {name} rows={len(rows)} selected={count} expected_sha={outhash}')
          PY
          python3 extract.py
          cat > programs.py <<'PY'
          import hashlib, pathlib, struct
          P=pathlib.Path
          pins={1:'a35bf2d505ed1bab49bc494fa2989c7ea80ab8bf3b8453536c18e4203e0a672b',8:'194b298fb0c9b599e14d9ffe714072bbb74bafa2b2e46e857bb66d77853e42c4',32:'2c3a89e564d6b1b8cda97fe57a3ea28db46c1d2bee623e5d8528b2d222434333'}
          def ins(op,d=0,s=0,off=0,imm=0):return struct.pack('<BBhI',op,(s<<4)|d,off,imm&0xffffffff)
          for n,pin in pins.items():
              code=[ins(0xb7)]
              for i in range(n):code.extend([ins(0x79,2,1,16*i),ins(0x79,3,1,16*i+8),ins(0x1d,2,3,1),ins(0x44,0,0,0,1<<i)])
              raw=b''.join(code)+ins(0x95)
              assert len(raw)==8*(4*n+2) and hashlib.sha256(raw).hexdigest()==pin
              P(f'batch-{n}.bin').write_bytes(raw)
              print(f'PROGRAM width={n} instructions={len(raw)//8} sha={pin}')
          PY
          python3 programs.py
          cat > bench.c <<'EOF'
          #define _POSIX_C_SOURCE 200809L
          #include <ubpf.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <time.h>
          #include <inttypes.h>
          #define CHECK(x) do {if(!(x)){fprintf(stderr,"FAIL %d: %s\n",__LINE__,#x);exit(1);}}while(0)
          enum {N=8268, LOOPS=100};
          struct pair {uint64_t a,b;};
          struct chunk {struct pair p[32];unsigned valid;};
          static struct chunk chunks[N];
          static unsigned width;
          static uint64_t allowed(unsigned n){return (UINT64_C(1)<<n)-1;}
          static uint64_t now(void){struct timespec t;CHECK(clock_gettime(CLOCK_PROCESS_CPUTIME_ID,&t)==0);return (uint64_t)t.tv_sec*1000000000u+t.tv_nsec;}
          typedef uint64_t (*fn)(struct ubpf_vm*,struct pair*);
          __attribute__((noinline)) static uint64_t native(struct ubpf_vm *v,struct pair*p){
              (void)v;uint64_t m=0;for(unsigned i=0;i<width;i++)if(p[i].a!=p[i].b)m|=UINT64_C(1)<<i;return m;
          }
          __attribute__((noinline)) static uint64_t vmrun(struct ubpf_vm*v,struct pair*p){uint64_t out=UINT64_MAX;CHECK(ubpf_exec(v,p,width*sizeof(*p),&out)==0);return out;}
          __attribute__((noinline)) static uint64_t guarded(fn f,struct ubpf_vm*v,const struct chunk*c){
              struct pair copy[32];CHECK(c->valid>0 && c->valid<=width);
              memcpy(copy,c->p,width*sizeof(*copy));
              for(unsigned i=0;i<width;i++){CHECK(copy[i].a<=1 && copy[i].b<=1);if(i>=c->valid)CHECK(copy[i].a==0 && copy[i].b==0);}
              uint64_t m=f(v,copy);CHECK((m&~allowed(c->valid))==0 && memcmp(copy,c->p,width*sizeof(*copy))==0);return m;
          }
          int main(int argc,char**argv){
              CHECK(argc==5 && sizeof(struct pair)==16);width=(unsigned)strtoul(argv[1],NULL,10);CHECK(width==1||width==8||width==32);
              FILE*f=fopen(argv[2],"r");CHECK(f);unsigned q,a,b,c,d;
              for(unsigned i=0;i<N;i++){CHECK(fscanf(f,"%u %u %u %u %u",&q,&a,&b,&c,&d)==5);CHECK(q<=1&&a<=65535&&b<=65535&&c<=1&&d<=1);chunks[i/width].p[i%width]=(struct pair){c,d};chunks[i/width].valid++;}
              int ch;do{ch=fgetc(f);}while(ch==' '||ch=='\n'||ch=='\r'||ch=='\t');CHECK(ch==EOF&&!ferror(f)&&fclose(f)==0);
              unsigned calls=(N+width-1)/width;unsigned char code[1040];size_t len=8*(4*width+2);
              f=fopen(argv[3],"rb");CHECK(f);CHECK(fread(code,1,len,f)==len&&fgetc(f)==EOF&&!ferror(f)&&fclose(f)==0);
              struct ubpf_vm*v=ubpf_create();CHECK(v);
              CHECK(ubpf_set_execution_profile(v,UBPF_EXECUTION_PROFILE_SAFE)==0);
              CHECK(ubpf_set_instruction_limit(v,4*width+2,NULL)==0);
              char*err=NULL;CHECK(ubpf_load(v,code,len,&err)==0);free(err);
              struct chunk test={0};test.valid=width;for(unsigned i=0;i<width;i++)test.p[i].b=1;
              CHECK(guarded(native,v,&test)==allowed(width)&&guarded(vmrun,v,&test)==allowed(width));
              memset(test.p,0,sizeof(test.p));CHECK(guarded(native,v,&test)==0&&guarded(vmrun,v,&test)==0);
              test.valid=1;test.p[0].a=1;CHECK(guarded(native,v,&test)==1&&guarded(vmrun,v,&test)==1);
              uint64_t out=0;CHECK(ubpf_exec(v,test.p,width*sizeof(struct pair)-1,&out)!=0);
              CHECK(ubpf_set_instruction_limit(v,1,NULL)==0);CHECK(ubpf_exec(v,test.p,width*sizeof(struct pair),&out)!=0);CHECK(ubpf_set_instruction_limit(v,4*width+2,NULL)==0);
              if(width>1){test.p[1].b=1;CHECK(ubpf_exec(v,test.p,width*sizeof(struct pair),&out)==0&&(out&~allowed(1))!=0);}
              f=fopen(argv[4],"w");CHECK(f);uint64_t total=0;
              for(unsigned k=0;k<calls;k++){uint64_t m=guarded(native,v,&chunks[k]);CHECK(m==guarded(vmrun,v,&chunks[k]));for(unsigned j=0;j<chunks[k].valid;j++)if(m&(UINT64_C(1)<<j)){CHECK(fprintf(f,"%u\n",k*width+j+1)>0);total++;}}
              CHECK(fclose(f)==0);
              printf("PARITY width=%u records=%u calls=%u tail=%u selected=%" PRIu64 " positive=3 runtime_negative=2 tail_negative=%u\n",width,N,calls,chunks[calls-1].valid,total,width>1);
              for(unsigned rep=0;rep<3;rep++)for(unsigned j=0;j<2;j++){
                  unsigned arm=(rep+j)%2;fn call=arm?vmrun:native;uint64_t sum=0,start=now();
                  for(unsigned pass=0;pass<LOOPS;pass++)for(unsigned k=0;k<calls;k++)sum+=(uint64_t)__builtin_popcountll(guarded(call,v,&chunks[k]));
                  uint64_t dt=now()-start;CHECK(sum==total*LOOPS);
                  printf("ARM width=%u rep=%u mode=%s records=%u calls=%u cpu_ns=%" PRIu64 " selected=%" PRIu64 "\n",width,rep,arm?"safe-guarded":"native-guarded",N*LOOPS,calls*LOOPS,dt,sum);
              }
              ubpf_destroy(v);return 0;
          }
          EOF
          lib=$(find build -name libubpf.a -type f -print -quit)
          test -n "$lib"
          cc -O2 -Wall -Wextra -Werror -Iubpf/vm/inc -Ibuild/vm bench.c "$lib" -lm -o bench
          sha256sum extract.py programs.py bench.c "$lib" bench
          for mode in split packed; do
            echo "BEGIN $mode"
            awk '{print $1}' "$mode.expected" > "$mode.indices"
            for width in 1 8 32; do
              timeout 90s ./bench "$width" "$mode.rows" "batch-$width.bin" "$mode-$width.actual"
              cmp "$mode.indices" "$mode-$width.actual"
              sha256sum "$mode-$width.actual"
            done
            echo "END $mode"
          done
      - name: Clean temporary input
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/upip-e02"
