name: Wine 11 Disposable-Layer Composite HIL

# Public PR source snapshots only; never publishes images/diagnostics.
on:
  pull_request:
    paths:
      - '.github/workflows/wine11-disposable-layer-hil.yml'
      - 'compose/layered.yml'
      - 'docker/Dockerfile'
      - 'docker/entrypoint.sh'
      # Real startup and read-only HIL must requalify actual early-admission
      # and infrastructure changes, not only the entrypoint wrapper.
      - 'api/core/writer_admission.py'
      # Owner-pointer semantics may change startup/recovery in a combined
      # candidate; source-only formal green cannot replace real Wine11 HIL.
      - 'api/core/persistent_owner.py'
      - 'tests/test_persistent_owner.py'
      - 'formal/PERSISTENT_SESSION_OWNER.md'
      - 'formal/tla/PersistentSessionOwner*.tla'
      - 'formal/tla/PersistentSessionOwner*.cfg'
      - 'formal/tests/test_persistent_session_owner.py'
      - 'scripts/ci/test.sh'
      - 'api/server.py'
      - 'api/core/handover_recovery.py'
      - 'scripts/init/00-setup-user.sh'
      - 'scripts/init/10-setup-infra.sh'
      - 'scripts/init/30-start-services.sh'
      - 'scripts/ci/classify-startup-logs.py'
      - 'tests/test_early_writer_admission.py'
      - 'tests/test_startup_checkpoint_redaction.py'
      - 'scripts/layers/**'
      - 'scripts/ci/qualify-wine11-layered.sh'
      - 'scripts/ci/classify-layer-init-logs.py'
      - 'tests/test_layer_init_diagnostics.py'

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

concurrency:
  group: wine11-layer-hil-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  composite-wine11-hil:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - name: Checkout exact layered architecture PR source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          path: layered
      - name: Checkout exact separately qualified Wine11 source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: SemperSupra/WineBot
          persist-credentials: false
          ref: 8c5ed8019a3518cf534b158662755172bfce7c59
          path: wine11-candidate
      - name: Free disposable runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift
      - name: Source syntax and frozen composite ownership
        working-directory: layered
        run: |
          bash -n scripts/ci/qualify-wine11-layered.sh
          python3 -m unittest discover -s tests -p 'test_layer_init_diagnostics.py' -v
          test -f ../wine11-candidate/scripts/init/20-setup-wine.sh
          test -f ../wine11-candidate/scripts/ci/classify-wine11-soak.py
      - name: Build ephemeral candidate and qualify read-only Wine11 replay
        working-directory: layered
        run: bash scripts/ci/qualify-wine11-layered.sh
      - name: Report only fixed result
        if: success()
        run: echo 'WINE11_LAYER_HIL stage=qualified_composite'
