name: winebot-target-epoch-fencing-rdte
# Public synthetic-only oracle. No native target discovery or control.
on:
  push:
    branches:
      - qualification/target-epoch-fencing-20261101
    paths:
      - tests/portable_observer_contract/**
      - .github/workflows/winebot-target-epoch-fencing-rdte.yml
permissions:
  contents: read
jobs:
  independent-host-oracle:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.24'
          cache: false
      - name: Offline shared observer and target generation tests
        working-directory: tests/portable_observer_contract
        run: go test -race -count=1 ./...
      - name: Qualification scope
        if: always()
        run: echo 'Synthetic target fencing only. No HWND/PID association, source attestation, input authority, native WinInspect change or release.'
