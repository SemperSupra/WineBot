name: QEMU checkpoint-backed GDB reverse continue R1d3
on:
  push:
    branches: [rdte/synthetic-analysis-b05-20261125]
    paths: [.github/workflows/teo-reverse-continue-r1d3.yml]
permissions:
  contents: read
jobs:
  reverse:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Install distro tools
        run: |
          set -euo pipefail
          mkdir -p receipts
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils gdb
          qemu-system-x86_64 --version > receipts/qemu-version.txt
          gdb --version > receipts/gdb-version.txt
          sha256sum "$(command -v qemu-system-x86_64)" "$(command -v gdb)" > receipts/binaries.sha256
          qemu-img create -f qcow2 snapshot.qcow2 128M
      - name: Record BIOS execution and reverse step in GDB
        run: |
          set -euo pipefail
          cat > receipts/drive.py <<'PY'
          import hashlib,json,pathlib,socket,subprocess,time
          p=pathlib.Path("receipts")
          base=["qemu-system-x86_64","-machine","q35","-accel","tcg,thread=single","-smp","1","-m","128","-display","none","-serial","none","-monitor","none","-nic","none","-drive","file=snapshot.qcow2,if=none,format=qcow2"]
          def launch(mode,extra):
              log=(p/f"{mode}.stderr").open("wb")
              proc=subprocess.Popen(base+["-icount",f"shift=7,rr={mode},rrfile=receipts/record.bin,rrsnapshot=init","-qmp",f"unix:{mode}.sock,server=on,wait=off"]+extra,stdout=subprocess.DEVNULL,stderr=log)
              log.close()
              return proc
          def connect(mode,proc):
              s=socket.socket(socket.AF_UNIX); deadline=time.monotonic()+15
              while time.monotonic()<deadline:
                  if proc.poll() is not None: raise RuntimeError("early exit")
                  try: s.connect(f"{mode}.sock"); break
                  except (FileNotFoundError,ConnectionRefusedError): time.sleep(.05)
              else: raise TimeoutError("qmp connect")
              s.settimeout(15); f=s.makefile("rwb")
              def recv():
                  row=json.loads(f.readline())
                  with (p/f"{mode}.qmp.jsonl").open("a") as out: out.write(json.dumps({"recv":row})+"\n")
                  return row
              assert "QMP" in recv()
              def cmd(command):
                  req={"execute":command}
                  with (p/f"{mode}.qmp.jsonl").open("a") as out: out.write(json.dumps({"send":req})+"\n")
                  f.write(json.dumps(req).encode()+b"\n");f.flush()
                  while True:
                      r=recv()
                      if "error" in r: raise RuntimeError(r)
                      if "return" in r: return r["return"]
              cmd("qmp_capabilities")
              return s,f,cmd
          def cleanup(proc):
              if proc.poll() is None:
                  proc.terminate()
                  try:proc.wait(timeout=5)
                  except subprocess.TimeoutExpired:proc.kill();proc.wait()
          rec=launch("record",[])
          try:
              s,f,c=connect("record",rec)
              with s,f:
                  deadline=time.monotonic()+30
                  while time.monotonic()<deadline:
                      if c("query-replay")["icount"]>10000:break
                      time.sleep(.05)
                  else:raise TimeoutError("record progress")
                  c("quit")
              assert rec.wait(timeout=10)==0
          finally:cleanup(rec)
          rr=p/"record.bin"; before=hashlib.sha256(rr.read_bytes()).hexdigest()
          assert rr.stat().st_size>0
          subprocess.run(["qemu-img","snapshot","-l","snapshot.qcow2"],check=True,stdout=(p/"snapshots.txt").open("w"))
          assert "init" in (p/"snapshots.txt").read_text()
          script=p/"gdb.cmd"
          script.write_text("""set pagination off
          set confirm off
          set architecture i386:x86-64
          target remote 127.0.0.1:12345
          python
          import gdb,json,re
          def pc(): return int(gdb.parse_and_eval("$pc"))
          def linear():
              regs=gdb.execute('monitor info registers',to_string=True)
              m=re.search(r'(?m)^CS\\s*=\\s*[0-9a-fA-F]+\\s+([0-9a-fA-F]+)',regs)
              assert m,repr(regs)
              base=int(m.group(1),16)
              return base+pc()
          forward=[]; linear_forward=[]
          for i in range(10):
              forward.append(pc()); linear_forward.append(linear())
              gdb.execute("stepi",to_string=True)
          reverse=[]
          for i in range(10):
              gdb.execute("reverse-stepi",to_string=True)
              reverse.append(pc())
          second=[]
          for i in range(10):
              second.append(pc())
              gdb.execute("stepi",to_string=True)
          print("TEO_PC_JSON "+json.dumps({"forward":forward,"reverse":reverse,"second":second}))
          assert len(set(forward))>1
          assert reverse==forward[::-1] and second==forward
          # Stop at a known earlier address, not the current instruction.
          assert len(set(forward))==10 and pc() not in forward
          assert len(set(linear_forward))==10 and linear()!=pc()
          print('TEO_ADDRESS_JSON '+json.dumps({'offset':forward,'linear':linear_forward}))
          for addr in (linear_forward[2],linear_forward[5],linear_forward[8]):
              gdb.execute("hbreak *"+hex(addr),to_string=True)
          hits=[]; linear_hits=[]
          for i in range(3):
              gdb.execute("reverse-continue",to_string=True)
              hits.append(pc()); linear_hits.append(linear())
          print("TEO_BREAK_JSON "+json.dumps({"hits":hits,"expected":[forward[8],forward[5],forward[2]],"linear_hits":linear_hits,"linear_expected":[linear_forward[8],linear_forward[5],linear_forward[2]]}))
          assert hits==[forward[8],forward[5],forward[2]] and linear_hits==[linear_forward[8],linear_forward[5],linear_forward[2]]
          end
          disconnect
          quit
          """)
          rep=launch("replay",["-gdb","tcp:127.0.0.1:12345","-S"])
          try:
              s,f,c=connect("replay",rep)
              with s,f:
                  with (p/"gdb.log").open("wb") as out:
                      subprocess.run(["gdb","-nx","-batch","-x",str(script)],stdout=out,stderr=subprocess.STDOUT,timeout=120,check=True)
                  status=c("query-status")
                  if status["running"]: c("stop")
                  assert not c("query-status")["running"]
                  c("quit")
              assert rep.wait(timeout=10)==0
          finally:cleanup(rep)
          assert before==hashlib.sha256(rr.read_bytes()).hexdigest()
          (p/"record.sha256").write_text(before+"\n")
          PY
          python3 receipts/drive.py
      - name: Independently score PC sequence and retained recording
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path("receipts")
          rows=[x.removeprefix("TEO_PC_JSON ") for x in (p/"gdb.log").read_text().splitlines() if x.startswith("TEO_PC_JSON ")]
          assert len(rows)==1
          r=json.loads(rows[0]); a,b,c=(r[x] for x in ("forward","reverse","second"))
          assert len(a)==len(b)==len(c)==10 and len(set(a))>1 and a==c and a[::-1]==b
          assert hashlib.sha256((p/"record.bin").read_bytes()).hexdigest()==(p/"record.sha256").read_text().strip()
          (p/"score.json").write_text(json.dumps(r,indent=2))
          print(json.dumps(r))
          hits=[x.removeprefix("TEO_BREAK_JSON ") for x in (p/"gdb.log").read_text().splitlines() if x.startswith("TEO_BREAK_JSON ")]
          assert len(hits)==1
          h=json.loads(hits[0]); assert h["hits"]==h["expected"]==[a[8],a[5],a[2]]
          address=[x.removeprefix("TEO_ADDRESS_JSON ") for x in (p/"gdb.log").read_text().splitlines() if x.startswith("TEO_ADDRESS_JSON ")]
          assert len(address)==1
          v=json.loads(address[0]); assert v["offset"]==a and h["linear_hits"]==h["linear_expected"]==[v["linear"][8],v["linear"][5],v["linear"][2]]
          (p/"break-score.json").write_text(json.dumps(h,indent=2))
          print(json.dumps(h))
          PY
      - name: Retain bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-reverse-continue-r1d3
          path: receipts/
          retention-days: 7
