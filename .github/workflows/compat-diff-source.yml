name: Compatibility comparator — synthetic source qualification

on:
  push:
    branches:
      - feat/compat-diff-comparator-v0-20261024
    paths:
      - qualification/**
      - tests/test_compatibility_comparator.py
      - .github/workflows/compat-diff-source.yml

permissions:
  contents: read

concurrency:
  group: compat-diff-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-only:
    name: Synthetic comparator only (no Wine/Windows/artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout public source without persisting credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Install pinned source-test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest==8.4.2 jsonschema==4.25.1
      - name: Assert JSON Schemas are well-formed (no fixtures printed)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          for path in (Path("qualification/schemas/observation-v0.schema.json"),
                       Path("qualification/schemas/public-report-v0.schema.json")):
              schema = json.loads(path.read_text(encoding="utf-8"))
              Draft202012Validator.check_schema(schema)
          print("Both public schemas valid")
          PY
      - name: Synthetic-only comparator falsification
        run: python3 -m pytest -q tests/test_compatibility_comparator.py --tb=no --show-capture=no -rN
      - name: Compile source without executing target environments
        run: python3 -m py_compile qualification/compare.py tests/test_compatibility_comparator.py

# No artifact uploads, WinBot, Wine, network services, screenshots, credentials,
# raw report dissemination, Docker builds, or public diagnostic bundles.
