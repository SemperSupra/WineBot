name: winebot-broker-incarnation
on:
  push:
    branches:
      - qualification/broker-incarnation-20261029
permissions:
  contents: read
jobs:
  actual:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_actual_broker_incarnation_rdte.py' -v
