name: VirtIO phase-aware network lifecycle witnesses
on:
  push:
    branches: [rdte/reactos-source-boot-20261123]
    paths: [.github/workflows/virtio-net-stress-v19b6.yml]
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Bind execution and find prior public run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = SemperSupra/WineBot
          test "$GITHUB_REF" = refs/heads/rdte/reactos-source-boot-20261123
          mkdir -p receipts
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=rdte/virtio-net-stress-v19b6 -f description='Public Linux guest experiment' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - name: Retrieve exact public source-built executables
        uses: actions/download-artifact@v4
        with:
          name: virtio-source-binaries-v17b
          run-id: 45625601744
          github-token: ${{ github.token }}
          path: binaries
      - name: Verify independent executable and firmware pins
        run: |
          set -euo pipefail
          cat > receipts/expected.sha256 <<'EOF'
          4d567f217c247a9d39f3d5e364992dbf16e2eb624fc1eee09c70828aae40dda5  binaries/stock-qemu-system-x86_64
          af5001a9a1c8e1d90436455b8f69ea4be8cd3ddbf6081b98a1d886dc2b24f5e6  binaries/candidate-qemu-system-x86_64
          ae6f6aa973aaccc143f57aa960fb035fd9de4daee4ad0cd713322f8c259e7650  binaries/pc-bios/bios-256k.bin
          cdf057a71b07e3b52b19cbe210bdefa59250d01a9810b960f7fe1f98eed95a27  binaries/pc-bios/kvmvapic.bin
          9c49e255340c78fc12e54ed043462bca02fb7fca29b7cfab62ff88a5344b6950  binaries/pc-bios/linuxboot_dma.bin
          08c3841ff05a3d374817035181743ec8fbb9f05d04e63d00cb5298a9acac2cb6  binaries/candidate.patch
          EOF
          sha256sum -c receipts/expected.sha256
          test "$(cat binaries/upstream-sha.txt)" = 8f66cb79044c370e3813c56ceb7a75a5ca2d0a0e
          chmod u+x binaries/*qemu-system-x86_64
          cp binaries/candidate.patch binaries/upstream-sha.txt receipts/
      - name: Retrieve qualified guest kernel
        uses: actions/download-artifact@v4
        with:
          name: virtio-guest-boot-v18c4
          run-id: 45641159935
          github-token: ${{ github.token }}
          path: guest-kernel
      - name: Install public packages and construct guest
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils seabios busybox-static linux-image-virtual cpio kmod zstd gcc libc6-dev libgnutls30t64 libpixman-1-0 zlib1g libnuma1 libglib2.0-0t64 libzstd1 libslirp0 libfdt1 libncursesw6 libaio1t64 liburing2
          binaries/candidate-qemu-system-x86_64 --version > receipts/qemu-version.txt
          ldd binaries/candidate-qemu-system-x86_64 > receipts/ldd.txt
          ! grep -q 'not found' receipts/ldd.txt
          dpkg-query -W qemu-system-x86 qemu-utils busybox-static linux-image-virtual > receipts/packages.txt
          echo 'c3b467db358cb512cb9dc4640acae5758499a771f826caaaae100a16f449a7d0  guest-kernel/bzImage' | sha256sum -c -
          cp guest-kernel/bzImage kernel.bin
          mkdir -p root/{bin,dev,proc,sys}
          cp "$(command -v busybox)" root/bin/busybox
          cat > root/init <<'SH'
          #!/bin/busybox sh
          set -eu
          B=/bin/busybox
          $B mount -t proc proc /proc
          $B mount -t sysfs sysfs /sys
          $B mount -t devtmpfs devtmpfs /dev
          $B ip link set lo up
          T=/sys/kernel/tracing
          $B mount -t tracefs tracefs "$T"
          echo 1 > "$T/events/virtio_observe/virtio_buffer/enable"
          echo 4096 > "$T/buffer_size_kb"
          echo 1 > "$T/tracing_on"
          echo NIC_UP > "$T/trace_marker"
          $B ip link set eth0 up
          $B ip addr add 10.0.2.15/24 dev eth0
          echo HTTP_START > "$T/trace_marker"
          pids=""
          for i in 1 2 3 4; do
            $B wget -O "/payload$i" http://10.0.2.100:18081/payload &
            pids="$pids $!"
          done
          for pid in $pids; do wait "$pid"; done
          for i in 1 2 3 4; do $B sha256sum "/payload$i"; done
          $B cp /payload1 /payload
          $B sha256sum /payload
          echo HTTP_END > "$T/trace_marker"
          echo NET_WORKLOAD_PASS
          echo 0 > "$T/tracing_on"
          echo GUEST_TRACE_BEGIN
          $B cat "$T/trace"
          echo GUEST_TRACE_END
          $B cat "$T/per_cpu/cpu0/stats"
          $B poweroff -f
          SH
          chmod 755 root/init
          cp root/init receipts/guest-init.sh
          (cd root && find . -print0 | cpio --null -o -H newc --owner=0:0 2>/dev/null | gzip -n) > initramfs.gz
      - name: Isolated real HTTP workload
        run: |
          set -euo pipefail
          mkdir -p fixture
          python3 -c 'from pathlib import Path; Path("fixture/payload").write_bytes(bytes(range(256))*256)'
          sha256sum fixture/payload > receipts/payload.sha256
          python3 -m http.server 18081 --bind 127.0.0.1 --directory fixture > receipts/http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          cat > receipts/run.py <<'PY'
          import pathlib,subprocess,re,json,hashlib
          P=pathlib.Path; r=P("receipts")
          expected=hashlib.sha256(P("fixture/payload").read_bytes()).hexdigest()
          results=[]
          for packed in (False,True):
              for mode in ("stock","candidate-off","candidate-on"):
                  name=("packed" if packed else "split")+"-"+mode
                  q="stock" if mode=="stock" else "candidate"
                  argv=[str(P("binaries/"+q+"-qemu-system-x86_64").resolve()),"-L",str(P("binaries/pc-bios").resolve()),"-accel","tcg","-machine","pc","-m","512","-smp","1","-nodefaults","-display","none","-monitor","none","-serial","stdio","-no-reboot","-kernel","kernel.bin","-initrd","initramfs.gz","-append","console=ttyS0 rdinit=/init panic=-1 quiet","-netdev","user,id=n,restrict=on,guestfwd=tcp:10.0.2.100:18081-tcp:127.0.0.1:18081","-device","virtio-net-pci,netdev=n,romfile=,disable-legacy=on,packed="+("on" if packed else "off")]
                  trace=r/(name+".trace")
                  if mode=="candidate-on":
                      events=r/(name+".events")
                      events.write_text("virtqueue_buffer_pop\nvirtqueue_buffer_fill_attempt\nvirtqueue_host_advance\n")
                      argv+=["-trace","events="+str(events),"-D",str(trace)]
                  log=r/(name+".serial")
                  with log.open("wb") as out:
                      p=subprocess.run(argv,stdout=out,stderr=out,timeout=120)
                  s=log.read_text(errors="replace")
                  t=trace.read_text(errors="replace") if trace.exists() else ""
                  row={"name":name,"exit":p.returncode,"payload_match":all(expected+"  /payload"+str(i) in s for i in range(1,5)),"guest_pass":"NET_WORKLOAD_PASS" in s,"host_pop":t.count("virtqueue_buffer_pop"),"host_fill":t.count("virtqueue_buffer_fill_attempt")}
                  guest=s.split("GUEST_TRACE_BEGIN",1)[-1].split("GUEST_TRACE_END",1)[0]
                  g={}
                  for m in re.finditer(r"dev=(\d+) queue=(\d+) id=(\d+) packed=([01]) consume=([01]) len=(\d+)",guest):
                      dev,qid,bid,ring,consume,length=m.groups()
                      key=f"{qid}:{consume}"
                      g[key]=g.get(key,0)+1
                  h={}
                  active={}
                  anomalies=[]
                  for m in re.finditer(r"virtqueue_buffer_(pop|fill_attempt)\s+dev (\S+) queue (\d+) elem (\S+) id (\d+) ndescs (\d+) packed ([01])",t):
                      kind,dev,qid,elem,bid,ndesc,ring=m.groups()
                      key=(dev,qid,bid)
                      count=f"{qid}:{kind}"
                      h[count]=h.get(count,0)+1
                      if kind=="pop":
                          if key in active: anomalies.append(["duplicate",list(key)])
                          active[key]=elem
                      elif active.pop(key,None)!=elem: anomalies.append(["unmatched_fill",list(key)])
                  row.update(guest_counts=g,host_counts=h,host_anomalies=anomalies,host_outstanding=len(active),phase_markers=all(x in guest for x in ("NIC_UP","HTTP_START","HTTP_END")))
                  from collections import defaultdict
                  gs=defaultdict(int); gc=defaultdict(int); hs=defaultdict(int); hc=defaultdict(int)
                  guest_active=set(); host_active=set(); guest_done=set(); host_done=set(); defects=[]
                  for m in re.finditer(r"dev=(\d+) queue=(\d+) id=(\d+) packed=([01]) consume=([01]) len=(\d+)",guest):
                      dev,qid,bid,ring,consume,length=m.groups()
                      key=(qid,bid)
                      if consume=="0":
                          if key in guest_active: defects.append(("guest duplicate",key))
                          guest_active.add(key);gs[key]+=1
                      else:
                          if key not in guest_active: defects.append(("guest left censored",key))
                          guest_active.discard(key);gc[key]+=1
                          guest_done.add((*key,gc[key]))
                  devices=set()
                  for m in re.finditer(r"virtqueue_buffer_(pop|fill_attempt)\s+dev (\S+) queue (\d+) elem (\S+) id (\d+) ndescs (\d+) packed ([01])",t):
                      kind,dev,qid,elem,bid,ndesc,ring=m.groups()
                      devices.add(dev);key=(qid,bid)
                      if kind=="pop":
                          if key in host_active: defects.append(("host duplicate",key))
                          host_active.add(key);hs[key]+=1
                      else:
                          if key not in host_active: defects.append(("host unmatched",key))
                          host_active.discard(key);hc[key]+=1
                          host_done.add((*key,hc[key]))
                  row.update(generation_matches=len(guest_done & host_done),guest_completed=len(guest_done),host_completed=len(host_done),guest_right_censored=len(guest_active),host_right_censored=len(host_active),generation_defects=defects,host_devices=len(devices),generation_set_equal=guest_done==host_done)
                  if mode=="candidate-on":
                      assert len(devices)==1 and not defects and guest_done==host_done and guest_done,row
                  results.append(row)
                  (r/"summary.json").write_text(json.dumps(results,indent=2))
                  assert p.returncode==0 and row["payload_match"] and row["guest_pass"],row
                  assert row["phase_markers"] and g,row
                  if mode=="candidate-on":assert row["host_pop"]>0 and row["host_fill"]>0 and not anomalies,row
          PY
          python3 receipts/run.py
      - name: Retain public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtio-net-stress-v19b6
          path: receipts/
          retention-days: 7
      - name: Record terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = SemperSupra/WineBot
          test "$GITHUB_REF" = refs/heads/rdte/reactos-source-boot-20261123
          case "$JOB_RESULT" in success) state=success;; failure) state=failure;; *) state=error;; esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=rdte/virtio-net-stress-v19b6 -f description='Public Linux guest wrapper result' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
