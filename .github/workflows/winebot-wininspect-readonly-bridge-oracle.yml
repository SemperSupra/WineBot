name: winebot-wininspect-readonly-bridge-oracle
on:
  push:
    branches:
      - qualification/wininspect-readonly-bridge-20261031
permissions:
  contents: read
jobs:
  read-only-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.24'
          cache: false
      - name: Run portable observer and WinInspect bridge tests
        working-directory: tests/portable_observer_contract
        run: go test -race -count=1 ./...
      - name: No private WinInspect source or live RPC
        if: always()
        run: echo 'Synthetic read-only adapter; no private source, no target identity or control.'
