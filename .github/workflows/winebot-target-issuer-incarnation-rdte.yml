name: winebot-target-issuer-incarnation-rdte
# Experimental local-registry anti-collision; NOT authenticated principal/source.
on:
  push:
    branches:
      - qualification/target-issuer-spoof-negative-20261102
    paths:
      - tests/portable_observer_contract/**
      - .github/workflows/winebot-target-issuer-incarnation-rdte.yml
permissions:
  contents: read
jobs:
  synthetic-issuer-oracle:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.24'
          cache: false
      - name: Offline independent registry incarnation and existing safety tests
        working-directory: tests/portable_observer_contract
        run: go test -race -count=1 ./...
      - name: Boundaries
        if: always()
        run: echo 'No real target identity, principal attestation, broker permission, native WinInspect provider or uploaded artifacts.'
