name: winebot-service-receipt-regression-batch
on:
  push:
    branches:
      - qualification/service-receipt-regression-batch-20261029
permissions:
  contents: read
jobs:
  service-and-broker:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install project-pinned API dependencies in isolated venv
        run: |
          python3 -m venv /tmp/winebot-service-rdte-venv
          /tmp/winebot-service-rdte-venv/bin/python -m pip install --quiet --disable-pip-version-check -r requirements/requirements-rel.txt
      - run: /tmp/winebot-service-rdte-venv/bin/python -m unittest discover -s tests -p 'test_wine_events_service_rdte.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_actual_broker_incarnation_rdte.py' -v
  source-and-process:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_wine_events_source_rdte.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_wine_events_process_rdte.py' -v
  registry-negative-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_registry_same_name_read_witness_rdte.py' -v
