name: RDTE WineBot WinInspect semantic readiness (public synthetic)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/rdte-wininspect-semantic.yml
      - scripts/ci/rdte-wininspect-semantic-runtime.sh
      - api/core/wininspect.py
      - tests/test_wininspect_portable_layout.py

permissions:
  contents: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: 'false'

jobs:
  semantic-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact disposable WineBot candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Start WineBot and qualify read-only WinInspect with synthetic Notepad
        shell: bash
        run: bash scripts/ci/rdte-wininspect-semantic-runtime.sh
