name: Public Conformance Evidence Safety Regression
on:
  pull_request:
    paths:
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/reusable-build-smoke-gate.yml'
      - '.github/workflows/public-conformance-evidence-guard.yml'
      - 'scripts/ci/sanitize-conformance-results.py'
      - 'tests/test_ci_public_conformance_summary.py'
      - 'scripts/ci/test.sh'

permissions:
  contents: read

jobs:
  redacted-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Install pinned public-only test runner
        run: python3 -m pip install --disable-pip-version-check pytest==8.4.2
      - name: Verify that only redacted conformance counts leave the job
        run: |
          set -euo pipefail
          python3 -m pytest -q tests/test_ci_public_conformance_summary.py
          python3 -m py_compile scripts/ci/sanitize-conformance-results.py
