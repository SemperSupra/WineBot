name: VirtIO recovery-first 2D GPU and input native workloads
on:
  push:
    branches: [rdte/reactos-source-boot-20261123]
    paths: [.github/workflows/virtio-serial-data-v26.yml]
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  interaction:
    strategy:
      fail-fast: false
      matrix:
        lane: [serial]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      LANE: ${{ matrix.lane }}
    steps:
      - name: Bind admitted public execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = SemperSupra/WineBot
          test "$GITHUB_REF" = refs/heads/rdte/reactos-source-boot-20261123
          mkdir -p receipts
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context="rdte/virtio-serial-data-v26-$LANE" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/download-artifact@v4
        with:
          name: virtio-source-binaries-v18f3
          run-id: 45715597435
          github-token: ${{ github.token }}
          path: binaries
      - name: Verify pinned emulator and firmware
        run: |
          set -euo pipefail
          cat > receipts/expected.sha256 <<'EOF'
          4d567f217c247a9d39f3d5e364992dbf16e2eb624fc1eee09c70828aae40dda5  binaries/stock-qemu-system-x86_64
          7eca8293689317017ee7b48f55459809dab56c01209bd807ba73a7eb05d9d573  binaries/candidate-qemu-system-x86_64
          ae6f6aa973aaccc143f57aa960fb035fd9de4daee4ad0cd713322f8c259e7650  binaries/pc-bios/bios-256k.bin
          cdf057a71b07e3b52b19cbe210bdefa59250d01a9810b960f7fe1f98eed95a27  binaries/pc-bios/kvmvapic.bin
          9c49e255340c78fc12e54ed043462bca02fb7fca29b7cfab62ff88a5344b6950  binaries/pc-bios/linuxboot_dma.bin
          cb0f6b199da98503aba440daa75c5882d6238af1707c059957597aa8cdc592b2  binaries/candidate.patch
          EOF
          sha256sum -c receipts/expected.sha256
          test "$(cat binaries/upstream-sha.txt)" = 8f66cb79044c370e3813c56ceb7a75a5ca2d0a0e
          chmod u+x binaries/*qemu-system-x86_64
          cp binaries/candidate.patch binaries/upstream-sha.txt receipts/
      - name: Build real Linux guest fixture
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils busybox-static linux-image-virtual cpio kmod zstd gcc libc6-dev libgnutls30t64 libpixman-1-0 zlib1g libnuma1 libglib2.0-0t64 libzstd1 libslirp0 libfdt1 libncursesw6 libaio1t64 liburing2
          k=$(find /boot -maxdepth 1 -name 'vmlinuz-*-generic' -printf '%f\n' | sort -V | tail -1)
          test -n "$k"
          ver=$(echo "$k" | sed 's/^vmlinuz-//')
          sudo apt-get install -y -qq --no-install-recommends "linux-modules-extra-$ver"
          sudo cp "/boot/$k" kernel.bin
          sudo chmod 644 kernel.bin
          echo "$ver" > receipts/kernel-release.txt
          mkdir -p root/{bin,dev,proc,sys,modules}
          cp "$(command -v busybox)" root/bin/busybox
          mods="virtio_pci"
          mods="$mods virtio_console"
          for m in $mods; do modprobe -S "$ver" --show-depends "$m"; done > receipts/module-deps.txt
          : > root/modules/load
          awk '$1=="insmod"&&!seen[$2]++{print $2}' receipts/module-deps.txt | while read -r src; do
            name=$(basename "$src" | sed -E 's/\.(zst|xz|gz)$//')
            case "$src" in *.zst) zstd -dc "$src" > "root/modules/$name";; *.xz) xz -dc "$src" > "root/modules/$name";; *.gz) gzip -dc "$src" > "root/modules/$name";; *) cp "$src" "root/modules/$name";; esac
            echo "/modules/$name" >> root/modules/load
          done
          cat > receipts/serial.c <<'C'
          #include <fcntl.h>
          #include <unistd.h>
          #include <assert.h>
          #include <stdio.h>
          #include <string.h>
          #include <poll.h>
          int main(void){
              int fd=-1; unsigned char b[4096];
              for(int i=0;i<30&&fd<0;i++){fd=open("/dev/vport0p1",O_RDWR);if(fd<0)sleep(1);}
              assert(fd>=0);puts("SERIAL_READY");fflush(stdout);
              size_t n=0;
              while(n<sizeof(b)){struct pollfd p={fd,POLLIN,0};assert(poll(&p,1,10000)>0);ssize_t k=read(fd,b+n,sizeof(b)-n);assert(k>0);n+=k;}
              for(size_t i=0;i<n;i++){assert(b[i]==(unsigned char)(i%251));b[i]^=0x5a;}
              size_t sent=0;while(sent<n){ssize_t k=write(fd,b+sent,n-sent);assert(k>0);sent+=k;}
              puts("SERIAL_PASS");fflush(stdout);sleep(2);close(fd);return 0;
          }
          C
          gcc -O2 -static -Wall -Wextra -Werror "receipts/$LANE.c" -o root/bin/fixture
          cat > root/init <<'SH'
          #!/bin/busybox sh
          set -eu
          B=/bin/busybox
          $B mount -t proc proc /proc
          $B mount -t sysfs sysfs /sys
          $B mount -t devtmpfs devtmpfs /dev
          while read -r m; do $B insmod "$m"; done < /modules/load
          /bin/fixture
          echo FIXTURE_PASS
          $B sleep 2
          $B poweroff -f
          SH
          chmod 755 root/init
          cp root/init receipts/guest-init.sh
          (cd root && find . -print0 | cpio --null -o -H newc --owner=0:0 2>/dev/null | gzip -n) > initramfs.gz
          sha256sum kernel.bin initramfs.gz root/bin/fixture > receipts/guest.sha256
          find root/modules -type f -exec sha256sum {} \; > receipts/modules.sha256
      - name: Compare stock native candidate OFF and ON
        run: |
          set -euo pipefail
          cat > receipts/run.py <<'PY'
          import pathlib,subprocess,socket,time,json,re,hashlib
          P=pathlib.Path;r=P("receipts")
          payload=bytes(i%251 for i in range(4096));expected=bytes(x^0x5a for x in payload)
          semantic=["virtio_serial_send_control_event","virtio_serial_handle_control_message","virtio_console_chr_read","virtio_console_flush_buf"]
          core=["virtqueue_buffer_pop","virtqueue_buffer_fill_attempt","virtqueue_host_advance"]
          rows=[]
          for mode in ("stock-native","candidate-off","candidate-on"):
              q=str(P("binaries/"+("stock" if mode=="stock-native" else "candidate")+"-qemu-system-x86_64").resolve())
              sock=mode+".sock";log=r/(mode+".serial");trace=r/(mode+".trace")
              argv=[q,"-L",str(P("binaries/pc-bios").resolve()),"-accel","tcg","-m","512","-smp","1","-nodefaults","-display","none","-monitor","none","-serial","stdio","-nic","none","-no-reboot","-kernel","kernel.bin","-initrd","initramfs.gz","-append","console=ttyS0 rdinit=/init panic=-1 quiet","-device","virtio-serial-pci,id=vs,disable-legacy=on,packed=off","-chardev","socket,id=ch,path="+sock+",server=on,wait=off","-device","virtserialport,bus=vs.0,nr=1,chardev=ch,name=rdte.fixture"]
              if mode!="candidate-off":
                  ev=semantic+(core if mode=="candidate-on" else [])
                  f=r/(mode+".events");f.write_text("\n".join(ev)+"\n")
                  argv+=["-trace","events="+str(f),"-D",str(trace)]
              (r/(mode+"-argv.json")).write_text(json.dumps(argv))
              err=None;received=b""
              with log.open("wb") as out:
                  p=subprocess.Popen(argv,stdout=out,stderr=out)
                  try:
                      for _ in range(300):
                          if P(sock).exists():break
                          assert p.poll() is None
                          time.sleep(.1)
                      with socket.socket(socket.AF_UNIX) as s:
                          s.settimeout(30);s.connect(sock)
                          end=time.monotonic()+60
                          while "SERIAL_READY" not in log.read_text(errors="replace"):
                              assert time.monotonic()<end and p.poll() is None
                              time.sleep(.1)
                          s.sendall(payload)
                          while len(received)<len(expected):
                              b=s.recv(len(expected)-len(received));assert b;received+=b
                          assert received==expected
                          p.wait(timeout=30)
                  except Exception as e:err=repr(e)
                  finally:
                      if p.poll() is None:p.kill();p.wait()
              (r/(mode+".response")).write_bytes(received)
              raw=trace.read_text(errors="replace") if trace.exists() else ""
              counts={e:len(re.findall(r"\b"+e+r"\b",raw)) for e in semantic+core}
              ok=err is None and p.returncode==0 and received==expected and "FIXTURE_PASS" in log.read_text(errors="replace")
              if mode=="candidate-on":ok=ok and all(counts[e]>0 for e in core)
              if mode=="candidate-off":ok=ok and not trace.exists()
              if mode=="stock-native":ok=ok and counts["virtio_console_chr_read"]>0 and counts["virtio_console_flush_buf"]>0
              rows.append({"mode":mode,"pass":ok,"error":err,"exit":p.returncode,"bytes":len(received),"sha256":hashlib.sha256(received).hexdigest(),"counts":counts})
              (r/"summary.json").write_text(json.dumps(rows,indent=2))
          assert all(x["pass"] for x in rows),rows
          PY
          python3 receipts/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: virtio-serial-data-v26-${{ matrix.lane }}
          path: receipts/
          retention-days: 7
      - name: Bind terminal receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          test "$GITHUB_REPOSITORY" = SemperSupra/WineBot
          test "$GITHUB_REF" = refs/heads/rdte/reactos-source-boot-20261123
          case "$RESULT" in success|failure) state="$RESULT";; *) state=error;; esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="rdte/virtio-serial-data-v26-$LANE" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
