name: VirtIO phase-aware network lifecycle witnesses
on:
  push:
    branches: [rdte/reactos-source-boot-20261123]
    paths: [.github/workflows/virtio-reset-v18f4.yml]
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Bind execution and find prior public run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = SemperSupra/WineBot
          test "$GITHUB_REF" = refs/heads/rdte/reactos-source-boot-20261123
          mkdir -p receipts
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=rdte/virtio-reset-v18f4 -f description='Public Linux guest experiment' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - name: Retrieve exact public source-built executables
        uses: actions/download-artifact@v4
        with:
          name: virtio-source-binaries-v18f3
          run-id: 45715597435
          github-token: ${{ github.token }}
          path: binaries
      - name: Verify independent executable and firmware pins
        run: |
          set -euo pipefail
          sha256sum -c binaries/SHA256SUMS
          sha256sum binaries/candidate.patch > receipts/patch.sha256
          grep -q observe_reset binaries/candidate.patch
          test "$(cat binaries/upstream-sha.txt)" = 8f66cb79044c370e3813c56ceb7a75a5ca2d0a0e
          chmod u+x binaries/*qemu-system-x86_64
          cp binaries/candidate.patch binaries/upstream-sha.txt receipts/
      - name: Retrieve qualified guest kernel
        uses: actions/download-artifact@v4
        with:
          name: virtio-guest-boot-v18c4
          run-id: 45641159935
          github-token: ${{ github.token }}
          path: guest-kernel
      - name: Install public packages and construct guest
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils seabios busybox-static linux-image-virtual cpio kmod zstd gcc libc6-dev libgnutls30t64 libpixman-1-0 zlib1g libnuma1 libglib2.0-0t64 libzstd1 libslirp0 libfdt1 libncursesw6 libaio1t64 liburing2
          binaries/candidate-qemu-system-x86_64 --version > receipts/qemu-version.txt
          ldd binaries/candidate-qemu-system-x86_64 > receipts/ldd.txt
          ! grep -q 'not found' receipts/ldd.txt
          dpkg-query -W qemu-system-x86 qemu-utils busybox-static linux-image-virtual > receipts/packages.txt
          echo 'c3b467db358cb512cb9dc4640acae5758499a771f826caaaae100a16f449a7d0  guest-kernel/bzImage' | sha256sum -c -
          cp guest-kernel/bzImage kernel.bin
          mkdir -p root/{bin,dev,proc,sys}
          cp "$(command -v busybox)" root/bin/busybox
          cat > root/init <<'SH'
          #!/bin/busybox sh
          set -eu
          B=/bin/busybox
          $B mount -t proc proc /proc
          $B mount -t sysfs sysfs /sys
          $B mount -t devtmpfs devtmpfs /dev
          $B ip link set lo up
          T=/sys/kernel/tracing
          $B mount -t tracefs tracefs "$T"
          echo 1 > "$T/events/virtio_observe/virtio_buffer/enable"
          echo 1 > "$T/tracing_on"
          echo NIC_UP > "$T/trace_marker"
          $B ip link set eth0 up
          $B ip addr add 10.0.2.15/24 dev eth0
          echo HTTP_START > "$T/trace_marker"
          $B wget -O /payload http://10.0.2.100:18081/payload
          $B sha256sum /payload
          echo HTTP_END > "$T/trace_marker"
          echo NET_WORKLOAD_PASS
          echo 0 > "$T/tracing_on"
          echo GUEST_TRACE_BEGIN
          $B cat "$T/trace"
          echo GUEST_TRACE_END
          $B cat "$T/per_cpu/cpu0/stats"
          echo RESET_READY
          while true; do $B sleep 1; done
          SH
          chmod 755 root/init
          cp root/init receipts/guest-init.sh
          (cd root && find . -print0 | cpio --null -o -H newc --owner=0:0 2>/dev/null | gzip -n) > initramfs.gz
      - name: Isolated real HTTP workload
        run: |
          set -euo pipefail
          mkdir -p fixture
          python3 -c 'from pathlib import Path; Path("fixture/payload").write_bytes(bytes(range(256))*256)'
          sha256sum fixture/payload > receipts/payload.sha256
          python3 -m http.server 18081 --bind 127.0.0.1 --directory fixture > receipts/http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          sleep 1
          cat > receipts/run.py <<'PY'
          import pathlib,subprocess,socket,json,time,re
          P=pathlib.Path;r=P("receipts")
          results=[]
          for packed in (False,True):
              name="packed" if packed else "split"
              trace=r/(name+".trace"); log=r/(name+".serial")
              events=r/(name+".events");events.write_text("virtqueue_reset_boundary\nvirtqueue_buffer_pop\n")
              sock=str(P(name+".sock").resolve())
              argv=[str(P("binaries/candidate-qemu-system-x86_64").resolve()),"-L",str(P("binaries/pc-bios").resolve()),"-accel","tcg","-machine","pc","-m","512","-smp","1","-nodefaults","-display","none","-monitor","none","-serial","stdio","-kernel","kernel.bin","-initrd","initramfs.gz","-append","console=ttyS0 rdinit=/init panic=-1 quiet","-netdev","user,id=n,restrict=on,guestfwd=tcp:10.0.2.100:18081-tcp:127.0.0.1:18081","-device","virtio-net-pci,netdev=n,romfile=,disable-legacy=on,packed="+("on" if packed else "off"),"-qmp","unix:"+sock+",server=on,wait=off","-trace","events="+str(events),"-D",str(trace)]
              with log.open("wb") as out:
                  p=subprocess.Popen(argv,stdout=out,stderr=out)
                  try:
                      deadline=time.monotonic()+90
                      while "RESET_READY" not in log.read_text(errors="replace"):
                          assert p.poll() is None and time.monotonic()<deadline
                          time.sleep(.2)
                      before=trace.read_text(errors="replace")
                      assert "virtqueue_buffer_pop" in before
                      with socket.socket(socket.AF_UNIX) as s:
                          s.settimeout(10);s.connect(sock)
                          f=s.makefile("rwb")
                          transcript=[]
                          def recv():
                              obj=json.loads(f.readline());transcript.append(obj);return obj
                          recv()
                          def cmd(name):
                              f.write((json.dumps({"execute":name})+"\n").encode());f.flush()
                              while True:
                                  x=recv()
                                  if "return" in x:return
                                  assert "error" not in x,x
                          cmd("qmp_capabilities");cmd("system_reset")
                          deadline=time.monotonic()+10
                          while "virtqueue_reset_boundary" not in trace.read_text(errors="replace")[len(before):] and time.monotonic()<deadline:time.sleep(.1)
                          after=trace.read_text(errors="replace")
                          (r/(name+".qmp.json")).write_text(json.dumps(transcript,indent=2))
                          row={"ring":name,"before":before.count("virtqueue_reset_boundary"),"after":after.count("virtqueue_reset_boundary"),"pop_before":before.count("virtqueue_buffer_pop")}
                          results.append(row);(r/"summary.json").write_text(json.dumps(results,indent=2))
                          assert row["before"]==0 and row["after"]>0,row
                  finally:
                      p.terminate()
                      try:p.wait(timeout=10)
                      except subprocess.TimeoutExpired:p.kill();p.wait()
          PY
          python3 receipts/run.py
      - name: Retain public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtio-reset-v18f4
          path: receipts/
          retention-days: 7
      - name: Record terminal status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = SemperSupra/WineBot
          test "$GITHUB_REF" = refs/heads/rdte/reactos-source-boot-20261123
          case "$JOB_RESULT" in success) state=success;; failure) state=failure;; *) state=error;; esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=rdte/virtio-reset-v18f4 -f description='Public Linux guest wrapper result' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
