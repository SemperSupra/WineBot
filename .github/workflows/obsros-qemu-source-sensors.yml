name: OBS-ROS QEMU Source Sensor Build and Synthetic PIO Qualification
on:
  push:
    branches:
      - rdte/reactos-source-boot-20261123
    paths:
      - .github/workflows/obsros-qemu-source-sensors.yml
  workflow_dispatch:
permissions:
  contents: read
env:
  QEMU_SOURCE_SHA: 8f66cb79044c370e3813c56ceb7a75a5ca2d0a0e
jobs:
  host-sensor-source:
    name: Pinned upstream QEMU i386 TCG and trace-sensor source build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Admit public-only execution and obtain build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "SemperSupra/WineBot"
          test "$GITHUB_REF" = "refs/heads/rdte/reactos-source-boot-20261123"
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential git ninja-build python3-venv python3-pip pkg-config libglib2.0-dev libpixman-1-dev libfdt-dev libzstd-dev meson
          mkdir -p receipts
          cc --version | head -n1 > receipts/cc-version.txt
          cmake --version | head -n1 > receipts/cmake-version.txt
          ninja --version > receipts/ninja-version.txt
          meson --version > receipts/system-meson-version.txt
      - name: Clone exact QEMU public source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --single-branch https://github.com/qemu/qemu.git qemu
          git -C qemu checkout --detach "$QEMU_SOURCE_SHA"
          test "$(git -C qemu rev-parse HEAD)" = "$QEMU_SOURCE_SHA"
          git -C qemu status --porcelain=v1 > receipts/source-status.txt
          printf 'qemu_source_sha=%s\n' "$QEMU_SOURCE_SHA" > receipts/source.txt
      - name: Configure host sensor baseline with log and simple trace backends
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cd build
          ../qemu/configure --target-list=i386-softmmu --enable-trace-backends=log,simple --disable-docs --disable-werror --disable-tools
      - name: Compile source QEMU and record build identity
        shell: bash
        run: |
          set -euo pipefail
          make -C build -j 4
          test -x build/qemu-system-i386
          build/qemu-system-i386 --version > receipts/qemu-version.txt
          sha256sum build/qemu-system-i386 > receipts/qemu-binary-sha256.txt
          test -s build/trace/trace-events-all || test -s build/trace-events-all || echo TRACE_EVENTS_ALL_LOCATION_UNKNOWN >> receipts/source.txt
      - name: Run original synthetic PIO boot sector and require observed host trace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          data = bytes([0xb0,0x41,0xe6,0xe9,0xb0,0x42,0xe6,0xe9,0xf4,0xeb,0xfe])
          Path("boot.bin").write_bytes(data + bytes(510-len(data)) + bytes([0x55,0xaa]))
          assert Path("boot.bin").stat().st_size == 512
          PY
          printf '%s\n' cpu_in cpu_out memory_region_ops_read memory_region_ops_write > receipts/trace-events.txt
          set +e
          timeout 20s build/qemu-system-i386 -machine pc -cpu pentium3 -smp 1 -m 128 -drive if=floppy,format=raw,file=boot.bin -boot order=a -nic none -display none -vga none -serial none -monitor none -no-reboot -debugcon file:receipts/debugcon.txt -global isa-debugcon.iobase=0xe9 -trace events=receipts/trace-events.txt,file=receipts/qemu-trace.log > receipts/qemu-stderr.log 2>&1
          rc="$?"
          set -e
          echo "$rc" > receipts/qemu-exit.txt
          if test ! -f receipts/debugcon.txt; then echo DEBUGCON_ABSENT > receipts/classification.txt; exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          data=Path("receipts/debugcon.txt").read_bytes()
          if data != b'AB':
              raise SystemExit(f"unexpected debugcon output {data[:64]!r}")
          print("SYNTHETIC_PIO_DEBUGCON_AB_PASS")
          PY
          if ! grep -E 'cpu_out.*(0xe9|233)' receipts/qemu-trace.log receipts/qemu-stderr.log > receipts/cpu-out-observed.txt 2>/dev/null; then
            echo QEMU_SOURCE_BUILD_PASS_DEVICE_TRACE_MISSING > receipts/classification.txt
            exit 1
          fi
          echo QEMU_SOURCE_BUILT_AND_SYNTHETIC_HOST_PIO_TRACE_PASS > receipts/classification.txt
      - name: Preserve QEMU trace proof and candidate binary (not product)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsros-qemu-source-sensor-pio
          path: |
            receipts/
            build/qemu-system-i386
          retention-days: 3
          if-no-files-found: warn
