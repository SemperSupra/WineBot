name: winebot-integrated-legacy-regression-batch
on:
  push:
    branches:
      - qualification/integrated-legacy-regression-batch-20261029
permissions:
  contents: read
jobs:
  broker-positive-control:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_actual_broker_incarnation_rdte.py' -v
  legacy-source-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_wine_events_source_rdte.py' -v
  legacy-process-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_wine_events_process_rdte.py' -v
