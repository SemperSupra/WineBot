name: ReactOS installer namespace paired test
on:
  push:
    branches: [rdte/fdr-lua-cli-20261125]
    paths: [.github/workflows/fdr-reactos-os1.yml]
permissions:
  contents: read
  actions: read
jobs:
  reactos-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check public execution scope
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = SemperSupra/WineBot
          test "$GITHUB_REF" = refs/heads/rdte/fdr-lua-cli-20261125
          mkdir -p receipts
      - name: Retrieve existing public source-built ISO
        uses: actions/download-artifact@v4
        with:
          run-id: 45271529806
          github-token: ${{ github.token }}
          name: obsros-reactos-stock-source-build
          path: stock
      - name: Derive unattended installer configuration and test persistent guest
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils xorriso mtools
          qemu-system-i386 --version > receipts/qemu-version.txt
          iso="$(find stock -type f -name bootcd.iso -print -quit)"
          test -n "$iso"
          printf '%s  %s\n' cce7389f10018a81d0cfd075e1c0391d255288717e0bc19453572f0d5ce0f0ef "$iso" | sha256sum -c -
          sha256sum "$iso" > receipts/original-iso.sha256
          printf '%s\n' 'reactos/reactos@4fbbefd614b218afd3f0cbf09aa32998ea3ad7a6' 'public artifact 14866900023' > receipts/provenance.txt
          xorriso -osirrox on -indev "$iso" -extract /freeldr.ini original.ini -extract /i386/unattend.inf original.inf -extract /i386/txtsetup.sif stock-txtsetup.sif -extract /reactos/unattend.inf stock-live.inf >receipts/extract.txt 2>&1
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
              "original.ini":"6d531155b9fb6afeb90a4c28ede6d763fddddcb5a87b5634bcab5e461c685151",
              "original.inf":"48f9a13c554573c5b8b73b0697a588f36b1e51c6f53e6b7fbc6ba4b8748874e8",
              "stock-txtsetup.sif":"74c31b716fc5b1dad699cf45b924229c465147d6b8e77abe572fbf01c4e69b94",
              "stock-live.inf":"f206fcab28d7102755e2a645c8d5336b19dd2c8e7488142cbca86c73283f71b3",
          }
          for name,digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,name
          b=Path("original.ini").read_bytes()
          assert b.count(b"DefaultOS=LiveImg_Debug")==1 and b.count(b"TimeOut=10")==1
          derived=b.replace(b"DefaultOS=LiveImg_Debug",b"DefaultOS=Setup_Debug").replace(b"TimeOut=10",b"TimeOut=1")
          assert hashlib.sha256(derived).hexdigest()=="6ccfbe578171d52a83deab1ccf8a2712ceceb8d06d595612fd8d49c20ba77751"
          inf=Path("original.inf").read_bytes()
          assert inf.count(b"UnattendSetupEnabled = no")==1
          inf=inf.replace(b"UnattendSetupEnabled = no",b"UnattendSetupEnabled = yes")
          assert hashlib.sha256(inf).hexdigest()=="9d668204d15abcf6746b20b320d1f599e858fa2f6fa66b395124a2131396956b"
          for name,data in [("freeldr.ini",derived),("unattend.inf",inf)]:
              with open(name,"xb") as f: f.write(data)
          PY
          cp freeldr.ini unattend.inf original.inf receipts/
          xorriso -indev "$iso" -outdev install.iso -boot_image any replay -map freeldr.ini /freeldr.ini -map unattend.inf /i386/unattend.inf -commit -end > receipts/remaster.txt 2>&1
          sha256sum install.iso > receipts/derived-iso.sha256
          xorriso -indev install.iso -report_el_torito plain >receipts/eltorito.txt 2>&1
          grep -qi 'El Torito boot img' receipts/eltorito.txt
          xorriso -osirrox on -indev install.iso -extract /freeldr.ini check.ini -extract /i386/unattend.inf check.inf -extract /i386/txtsetup.sif check-txtsetup.sif -extract /reactos/unattend.inf check-live.inf >receipts/roundtrip.txt 2>&1
          cmp freeldr.ini check.ini
          cmp unattend.inf check.inf
          cmp stock-txtsetup.sif check-txtsetup.sif
          cmp stock-live.inf check-live.inf
          sha256sum original.inf unattend.inf check.inf stock-txtsetup.sif check-txtsetup.sif stock-live.inf check-live.inf > receipts/roundtrip.sha256
          # Variant differs only by the additional case-distinct directory entry.
          xorriso -indev "$iso" -outdev variant.iso -boot_image any replay -map freeldr.ini /freeldr.ini -map unattend.inf /i386/unattend.inf -map unattend.inf /I386/unattend.inf -commit -end >receipts/variant-remaster.txt 2>&1
          xorriso -osirrox on -indev variant.iso -extract /freeldr.ini variant.ini -extract /i386/unattend.inf variant-lower.inf -extract /I386/unattend.inf variant-upper.inf -extract /i386/txtsetup.sif variant-txtsetup.sif -extract /reactos/unattend.inf variant-live.inf >receipts/variant-roundtrip.txt 2>&1
          cmp freeldr.ini variant.ini
          cmp unattend.inf variant-lower.inf
          cmp unattend.inf variant-upper.inf
          cmp stock-txtsetup.sif variant-txtsetup.sif
          cmp stock-live.inf variant-live.inf
          for arm in install variant; do
            xorriso -indev "$arm.iso" -ls / >"receipts/$arm-root.txt" 2>&1
            xorriso -indev "$arm.iso" -report_el_torito plain >"receipts/$arm-eltorito.txt" 2>&1
            grep -qi 'El Torito boot img' "receipts/$arm-eltorito.txt"
          done
          grep -F "'I386'" receipts/variant-root.txt
          grep -F "'i386'" receipts/variant-root.txt
          if grep -F "'I386'" receipts/install-root.txt; then echo 'control unexpectedly uppercase'; exit 1; fi
          sha256sum install.iso variant.iso variant-*.inf variant-txtsetup.sif > receipts/variant.sha256
          cat > install.py <<'PY'
          import json, pathlib, socket, subprocess, time
          P=pathlib.Path
          receipts=P("receipts")
          def phase(name,cd,boot,seconds):
              sock=P(name+".sock")
              serial=receipts/(name+".serial")
              args=["qemu-system-i386","-accel","tcg","-machine","pc","-cpu","pentium3","-smp","1","-m","768","-nic","none","-display","none","-vga","std","-serial","file:"+str(serial),"-monitor","none","-qmp",f"unix:{sock},server=on,wait=off","-drive","file=guest.qcow2,format=qcow2,if=ide","-boot",boot,"-no-reboot"]
              if cd: args+=["-cdrom","install.iso"]
              with (receipts/(name+".stderr")).open("wb") as err,(receipts/(name+".qmp.ndjson")).open("w",buffering=1) as log:
                  p=subprocess.Popen(args,stdout=err,stderr=err)
                  s=socket.socket(socket.AF_UNIX); s.settimeout(4)
                  outcome="UNKNOWN"
                  try:
                      end=time.monotonic()+20
                      while not sock.exists() and p.poll() is None and time.monotonic()<end: time.sleep(.1)
                      if p.poll() is not None: raise RuntimeError("early exit")
                      s.connect(str(sock)); f=s.makefile("rb"); i=0
                      def recv():
                          b=f.readline(262145)
                          if not b or len(b)>262144: raise EOFError()
                          obj=json.loads(b); log.write(json.dumps(obj)+"\n"); return obj
                      assert "QMP" in recv()
                      def call(cmd,args=None):
                          nonlocal i
                          i+=1; m={"execute":cmd,"id":i}
                          if args: m["arguments"]=args
                          log.write(json.dumps({"send":m})+"\n")
                          s.sendall(json.dumps(m).encode()+b"\r\n")
                          for _ in range(128):
                              r=recv()
                              if "event" in r: continue
                              assert r.get("id")==i and "return" in r,r
                              return r["return"]
                          raise RuntimeError("event budget")
                      call("qmp_capabilities")
                      start=time.monotonic(); next_capture=start; n=0
                      while p.poll() is None and time.monotonic()-start<seconds:
                          if serial.exists() and serial.stat().st_size>16*1024*1024: raise RuntimeError("serial budget exceeded")
                          if time.monotonic()>=next_capture:
                              try: call("screendump",{"filename":str(receipts/(f"{name}-{n:02d}.ppm"))})
                              except (EOFError,OSError): break
                              n+=1; next_capture=time.monotonic()+30
                          time.sleep(1)
                      if p.poll() is not None:
                          outcome=f"VM_EXIT_{p.returncode}"
                          assert p.returncode==0,p.returncode
                      else:
                          outcome="TIME_BOUND_OR_QMP_END"
                          try: call("screendump",{"filename":str(receipts/(name+"-final.ppm"))}); call("quit")
                          except (EOFError,OSError): pass
                  finally:
                      s.close()
                      if p.poll() is None:
                          p.terminate()
                          try: p.wait(timeout=10)
                          except subprocess.TimeoutExpired: p.kill(); p.wait()
                      (receipts/(name+".status")).write_text(outcome+"\n")
              return outcome
          def disk_probe(name):
              subprocess.run(["qemu-img","convert","-f","qcow2","-O","raw","guest.qcow2","probe.raw"],check=True,timeout=40)
              try:
                  with open("probe.raw","rb") as f: m=f.read(512)
                  (receipts/(name+"-mbr.hex")).write_text(m.hex()+"\n")
                  part=[]
                  for i in range(4):
                      e=m[446+i*16:462+i*16]; start=int.from_bytes(e[8:12],"little"); count=int.from_bytes(e[12:16],"little")
                      if e[4] and start and count and start+count<=4194304: part.append((e[4],start,count))
                  found=False
                  for typ,start,count in part:
                      r=subprocess.run(["mdir","-i",f"probe.raw@@{start*512}","::/ReactOS/system32/ntoskrnl.exe"],capture_output=True,text=True,timeout=15)
                      (receipts/(name+f"-kernel-{start}.txt")).write_text(r.stdout+r.stderr)
                      found=found or r.returncode==0
                  result={"arm":name,"mbr_signature":m[-2:]==b"\x55\xaa","mbr_all_zero":not any(m),"partitions":part,"kernel_present":found}
                  (receipts/(name+"-disk.json")).write_text(json.dumps(result)+"\n")
                  print(json.dumps(result),flush=True)
              finally: P("probe.raw").unlink(missing_ok=True)
          import os
          root=P.cwd()
          for name,media in [("control","install.iso"),("variant","variant.iso")]:
              folder=root/name; folder.mkdir()
              os.chdir(folder)
              try:
                  P("receipts").symlink_to(root/"receipts",target_is_directory=True)
                  P("install.iso").symlink_to(root/media)
                  subprocess.run(["qemu-img","create","-f","qcow2","guest.qcow2","2G"],check=True)
                  phase(name,True,"order=c,once=d",270)
                  disk_probe(name)
              finally:
                  P("guest.qcow2").unlink(missing_ok=True)
                  os.chdir(root)
          (receipts/"classification.txt").write_text("PAIR_CAPTURED; INDEPENDENT SCREEN AND DISK CLASSIFICATION REQUIRED; TIMEOUT IS NOT CAUSAL PROOF\n")
          PY
          cp install.py receipts/
          timeout 680s python install.py
      - name: Retain bounded installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reactos-installer-namespace-pair
          path: receipts/
          retention-days: 2
          if-no-files-found: warn
