name: winebot-batched-native-package-matrix
on:
  push:
    branches:
      - qualification/batched-native-package-matrix-20261031
permissions:
  contents: read
jobs:
  native-package-matrix:
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build real current observer and fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'toolchain_missing' }
          $arch = '${{ matrix.arch }}'
          $vcvars = Join-Path $vs ('VC/Auxiliary/Build/vcvars' + $(if ($arch -eq 'x86') { '32' } else { '64' }) + '.bat')
          New-Item -ItemType Directory -Path dist/bin -Force | Out-Null
          $commands = 'call "' + $vcvars + '" >nul && cl /nologo /W3 /O2 /Fe:dist/bin/win_event_observer.exe rdte/wine11/win_event_observer.c user32.lib && cl /nologo /W3 /O2 /Fe:dist/bin/win_event_fixture.exe rdte/wine11/win_event_fixture.c user32.lib'
          & cmd.exe /d /s /c $commands
          if ($LASTEXITCODE -ne 0) { throw 'compile_failed' }
      - name: Package, install, execute, uninstall and negative tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $arch = '${{ matrix.arch }}'
          $pkg = (Resolve-Path dist).Path
          $files = @{}
          foreach ($name in @('bin/win_event_observer.exe','bin/win_event_fixture.exe')) {
            $p = Join-Path $pkg $name
            $bytes = [IO.File]::ReadAllBytes($p)
            $pe = [BitConverter]::ToInt32($bytes,0x3c)
            $machine = [BitConverter]::ToUInt16($bytes,$pe+4)
            $expectedMachine = if ($arch -eq 'x86') { 0x14c } else { 0x8664 }
            if ($machine -ne $expectedMachine) { throw 'wrong_pe_machine' }
            $files[$name] = (Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          @{schema='winebot.toolkit.package.v0';target=('win-'+$arch);status='synthetic-rdte-only';files=$files} | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $pkg 'manifest.json')
          $root = Join-Path $env:RUNNER_TEMP ('winebot-matrix-'+$arch)
          $script = './scripts/rdte/install-portable-toolkit.ps1'
          & $script -Operation Install -PackageDir $pkg -InstallRoot $root -Version 'v1'
          & $script -Operation Install -PackageDir $pkg -InstallRoot $root -Version 'v2'
          foreach ($version in @('v1','v2')) {
            $dir = Join-Path $root ($version+'/bin')
            foreach ($name in @('win_event_observer.exe','win_event_fixture.exe')) {
              if ((Get-FileHash (Join-Path $dir $name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $files['bin/'+$name]) { throw 'installed_hash_mismatch' }
            }
            $fixture = Start-Process -FilePath (Join-Path $dir 'win_event_fixture.exe') -PassThru
            if (-not $fixture.WaitForExit(15000)) { $fixture.Kill(); throw 'fixture_timeout' }
            if ($fixture.ExitCode -ne 0) { throw 'fixture_nonzero' }
          }
          $refused = $false
          try { & $script -Operation Install -PackageDir $pkg -InstallRoot $root -Version 'v1' } catch { $refused = $true }
          if (-not $refused) { throw 'overwrite_not_refused' }
          & $script -Operation Uninstall -PackageDir $pkg -InstallRoot $root -Version 'v1'
          if (-not (Test-Path (Join-Path $root 'v2/bin/win_event_fixture.exe'))) { throw 'side_by_side_broken' }
          & $script -Operation Uninstall -PackageDir $pkg -InstallRoot $root -Version 'v2'
          if (Test-Path (Join-Path $root 'v2')) { throw 'uninstall_incomplete' }
          $files['bin/win_event_fixture.exe'] = '0'*64
          @{schema='winebot.toolkit.package.v0';target=('win-'+$arch);status='synthetic-rdte-only';files=$files} | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $pkg 'manifest.json')
          $refused = $false
          try { & $script -Operation Install -PackageDir $pkg -InstallRoot $root -Version 'tampered' } catch { $refused = $true }
          if (-not $refused) { throw 'tamper_not_refused' }
          Write-Output "PASS: $arch real PE, 2 side-by-side installs, fixture execution, uninstall, overwrite and tamper negatives"
      - name: Custody
        if: always()
        run: echo 'Ephemeral public runner only. No binaries, artifacts, releases or deployment.'
