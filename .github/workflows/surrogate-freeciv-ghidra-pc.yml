name: Freeciv source-known native PC to Ghidra interval qualification
on:
  pull_request:
    paths:
      - '.github/workflows/surrogate-freeciv-ghidra-pc.yml'
      - 'qualification/surrogates/freeciv/ghidra/PublicFreecivPcIntervals.java'
      - 'qualification/surrogates/freeciv/ghidra/pc_bridge.py'
      - 'qualification/surrogates/freeciv/ghidra/test_pc_bridge.py'
      - 'qualification/surrogates/freeciv/ghidra/PC_BRIDGE.md'

permissions:
  contents: read

jobs:
  source-known-runtime-pc:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Checkout public-only fixture without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: JDK25 for pinned upstream Ghidra
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Bounded deterministic and live source-known ptrace negatives
        run: |
          set -euo pipefail
          python3 qualification/surrogates/freeciv/ghidra/test_pc_bridge.py -v
      - name: Install pinned open-source Freeciv and pinned official Ghidra 12.2
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends freeciv-server=3.1.0+ds-1build5 curl unzip
          echo '33a15db1dc9a250c7ecf215c3fe6d50c34409301f4bb783914a6b16f3b3e8472  /usr/games/freeciv-server' | sha256sum -c -
          curl -fLSs --retry 2 --connect-timeout 15 --max-time 230 \
            'https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_12.2_build/ghidra_12.2_PUBLIC_20261016.zip' \
            -o "$RUNNER_TEMP/ghidra.zip"
          printf '%s  %s\n' '2c2cd776db3c1f6a097ba418922378ac3649cadd5e844a6f5f088ae628a7be67' "$RUNNER_TEMP/ghidra.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/ghidra"
          unzip -q "$RUNNER_TEMP/ghidra.zip" -d "$RUNNER_TEMP/ghidra"
      - name: Native Ghidra body intervals and actual Linux x86-64 instruction pointers
        run: |
          set -euo pipefail
          analyzer=$(find "$RUNNER_TEMP/ghidra" -type f -path '*/support/analyzeHeadless' -print -quit)
          test -n "$analyzer"
          mkdir -p "$RUNNER_TEMP/ghidra-projects" "$RUNNER_TEMP/private-pc" "$RUNNER_TEMP/public-safe"
          "$analyzer" "$RUNNER_TEMP/ghidra-projects" FreecivPcSurrogate \
            -import /usr/games/freeciv-server \
            -scriptPath "$GITHUB_WORKSPACE/qualification/surrogates/freeciv/ghidra" \
            -postScript PublicFreecivPcIntervals.java \
              33a15db1dc9a250c7ecf215c3fe6d50c34409301f4bb783914a6b16f3b3e8472 \
              "$RUNNER_TEMP/private-pc/ghidra-intervals.json" \
            -analysisTimeoutPerFile 180 -max-cpu 2 -deleteProject \
            > "$RUNNER_TEMP/private-pc/ghidra.log" 2>&1
          test -s "$RUNNER_TEMP/private-pc/ghidra-intervals.json" || { echo GHIDRA_EPHEMERAL_RANGES_ABSENT; exit 1; }
          python3 qualification/surrogates/freeciv/ghidra/pc_bridge.py \
            --intervals "$RUNNER_TEMP/private-pc/ghidra-intervals.json" \
            --output "$RUNNER_TEMP/public-safe/freeciv-pc-bridge.json" \
            --rounds 180
      - name: Upload only bounded PC/function-match counts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: freeciv-pc-ghidra-source-known-public
          path: ${{ runner.temp }}/public-safe/freeciv-pc-bridge.json
          if-no-files-found: ignore
          retention-days: 3
