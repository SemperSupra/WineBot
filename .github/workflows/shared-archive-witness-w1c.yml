name: Shared archive workload external outcome witnesses
on:
  push:
    branches: [rdte/custom-render-witness-20261125]
    paths: [.github/workflows/shared-archive-witness-w1c.yml]
permissions:
  contents: read
  statuses: write
jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: windows
            runner: windows-2022
          - lane: wine
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      LANE: ${{ matrix.lane }}
    steps:
      - name: Bind execution identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = SemperSupra/WineBot
          test "$GITHUB_REF" = refs/heads/rdte/custom-render-witness-20261125
          mkdir -p receipts
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context="rdte/shared-archive-w1c-$LANE" -f description='Public archive workload started' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - name: Prepare disposable Wine runtime
        if: matrix.lane == 'wine'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends wine wine64 xvfb xauth strace
          wine --version > receipts/runtime.txt
          dpkg-query -W wine wine64 xvfb xauth strace > receipts/packages.txt
      - name: Run same archive workload with independent ZIP and extracted-byte checks
        shell: bash
        run: |
          set -euo pipefail
          cat > receipts/run.py <<'PY'
          import hashlib,json,os,pathlib,subprocess,tempfile,time,urllib.request,zipfile
          R=pathlib.Path("receipts").resolve()
          def sha(b): return hashlib.sha256(b).hexdigest()
          lane=os.environ["LANE"]
          assert lane in ("wine","windows")
          results={"lane":lane,"source_url":"https://7-zip.org/a/7z2409-x64.exe","installer_sha256":None,"executable_sha256":None,"steps":[]}
          def record():
              (R/"summary.json").write_text(json.dumps(results,indent=2)+"\n")
          with tempfile.TemporaryDirectory(prefix="archive-witness-") as td:
              p=pathlib.Path(td)
              installer=p/"installer.exe"
              try:
                  with urllib.request.urlopen(results["source_url"],timeout=35) as f:
                      data=f.read(12*1024*1024+1)
                  assert 100000 < len(data) <= 12*1024*1024 and data.startswith(b"MZ")
                  installer.write_bytes(data)
                  results["installer_sha256"]=sha(data)
                  results["installer_bytes"]=len(data)
                  record()
                  env=dict(os.environ)
                  if lane=="wine":
                      env.update(WINEPREFIX=str(p/"prefix"),WINEARCH="win64",WINEDEBUG="-all")
                      command=["wine"]
                      exe=p/"prefix"/"drive_c"/"Program Files"/"7-Zip"/"7z.exe"
                      install=command+[str(installer),"/S"]
                  else:
                      command=[]
                      exe=p/"installed"/"7z.exe"
                      install=[str(installer),"/S","/D="+str(exe.parent)]
                  def call(name,argv,expected=0,trace=False,limit=60):
                      start=time.monotonic_ns()
                      actual=argv
                      tracepath=p/"trace.txt"
                      if trace and lane=="wine":
                          actual=["strace","-f","-qq","-e","trace=openat,read,write,rename,fsync,fdatasync","-o",str(tracepath)]+argv
                      cp=subprocess.run(actual,cwd=p,env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE,timeout=limit)
                      elapsed=time.monotonic_ns()-start
                      row={"step":name,"exit":cp.returncode,"elapsed_ns":elapsed}
                      if trace and lane=="wine" and tracepath.exists():
                          # Trace is a process-level witness, not attribution to a specific Windows API.
                          row["trace_bytes"]=tracepath.stat().st_size
                          row["trace_lines"]=sum(1 for _ in tracepath.open("rb"))
                          tracepath.unlink()
                      results["steps"].append(row);record()
                      assert (cp.returncode==expected if expected is not None else cp.returncode!=0),row
                  call("install",install,limit=180)
                  assert exe.is_file()
                  results["executable_sha256"]=sha(exe.read_bytes())
                  results["executable_bytes"]=exe.stat().st_size
                  dll=exe.parent/"7z.dll"
                  results["companion_sha256"]=sha(dll.read_bytes()) if dll.is_file() else None
                  record()
                  fixture={"one.txt":b"Shared archive workload\n","two.bin":bytes(range(256))*128}
                  for n,b in fixture.items():
                      (p/n).write_bytes(b)
                      os.utime(p/n,(1700000000,1700000000))
                      (R/("input-"+n)).write_bytes(b)
                  results["fixture_sha256"]={n:sha(b) for n,b in fixture.items()}
                  base=command+[str(exe)]
                  assert not (p/"sample.zip").exists()
                  call("archive",base+["a","-tzip","sample.zip","one.txt","two.bin","-y"],trace=True)
                  archive=p/"sample.zip"
                  with zipfile.ZipFile(archive) as z:
                      assert sorted(z.namelist())==sorted(fixture)
                      assert z.testzip() is None
                      for n,b in fixture.items(): assert z.read(n)==b
                  results["independent_zip_readback"]=True
                  results["archive_sha256"]=sha(archive.read_bytes())
                  call("extract",base+["x","sample.zip","-oextracted","-y"],trace=True)
                  for n,b in fixture.items():
                      out=(p/"extracted"/n).read_bytes()
                      assert out==b
                      (R/("extracted-"+n)).write_bytes(out)
                  results["extracted_sha256"]={n:sha((p/"extracted"/n).read_bytes()) for n in fixture}
                  (p/"truncated.zip").write_bytes(archive.read_bytes()[:16])
                  call("reject_truncated_archive",base+["t","truncated.zip"],expected=None)
                  results["classification"]="REAL UPSTREAM APPLICATION, GENERATED FIXTURE; NOT WINBOT/WINEBOT CONTROL ACCEPTANCE, SOURCE RECOVERY OR MATCHED PARITY UNTIL DIGEST AND ORACLE COMPARISON"
                  record()
              finally:
                  if lane=="wine":
                      subprocess.run(["wineserver","-k"],env=env if "env" in locals() else dict(os.environ,WINEPREFIX=str(p/"prefix")),stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=15,check=False)
          PY
          if test "$LANE" = wine; then
            xvfb-run -a -s "-screen 0 800x600x24 -nolisten tcp" python3 receipts/run.py
          else
            python receipts/run.py
          fi
          test "$(du -sk receipts | cut -f1)" -le 25600
      - name: Retain generated evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-archive-w1c-${{ matrix.lane }}
          path: receipts/
          retention-days: 7
      - name: Record terminal execution URL
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = SemperSupra/WineBot
          test "$GITHUB_REF" = refs/heads/rdte/custom-render-witness-20261125
          state=failure
          if test "$JOB_STATUS" = success; then state=success; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context="rdte/shared-archive-w1c-$LANE" -f description='Public archive workload terminal' -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
