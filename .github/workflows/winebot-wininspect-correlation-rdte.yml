name: WineBot WinInspect correlation synthetic qualification
on:
  push:
    branches:
      - qualification/wininspect-correlation-20261027
permissions:
  contents: read
jobs:
  correlation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_wininspect_correlation_rdte.py' -q
