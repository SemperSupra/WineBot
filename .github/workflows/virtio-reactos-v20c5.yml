name: ReactOS same-binary counter OFF ON runtime qualification
on:
  push:
    branches: [rdte/reactos-source-boot-20261123]
    paths: [.github/workflows/virtio-reactos-v20c5.yml]
permissions:
  contents: read
  actions: read
  statuses: write
jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Bind public run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = SemperSupra/WineBot
          test "$GITHUB_REF" = refs/heads/rdte/reactos-source-boot-20261123
          mkdir -p receipts
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=pending -f context=rdte/virtio-reactos-v20c5 -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - uses: actions/download-artifact@v4
        with:
          name: virtio-reactos-v20c4b
          run-id: 45956428512
          github-token: ${{ github.token }}
          path: image
      - name: Verify original image and native QEMU capabilities
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso
          cat > receipts/expected.sha256 <<'EOF'
          7871507000463fec9df19770be3f2c02e76cea22e96edf96424cf7e20c0d0779  image/counter-0.iso
          ef6d1c2c3eaedabdf7fdeba657ecf3ac73e6e7d024c2a3a7f5d851324a023435  image/counter-1.iso
          4fe8366648ee96fd108346208018e88c167cabfc1f8f76998cfa262eafe81319  image/candidate-netkvm.sys
          EOF
          sha256sum -c receipts/expected.sha256
          for mode in 0 1; do
            mkdir -p "extract-$mode"
            xorriso -osirrox on -indev "image/counter-$mode.iso" -extract /reactos/system32/drivers/netkvm.sys "extract-$mode/netkvm.sys" -extract /reactos/inf/netkvm.inf "extract-$mode/netkvm.inf" > "receipts/extract-$mode.log" 2>&1
            cmp "extract-$mode/netkvm.sys" image/candidate-netkvm.sys
            cp "extract-$mode/netkvm.inf" "receipts/actual-$mode.inf"
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          rows=[Path(f'extract-{i}/netkvm.inf').read_bytes().decode('utf-16') for i in (0,1)]
          for i,s in enumerate(rows):
              assert len(re.findall(r"(?mi)^HKR,\s*,\s*ObserveCounters,\s*0x00010001,\s*"+str(i)+r"\s*$",s))==1
          assert rows[0].replace('HKR, , ObserveCounters, 0x00010001, 0','HKR, , ObserveCounters, 0x00010001, 1')==rows[1]
          PY
          sha256sum extract-*/netkvm.* > receipts/extracted.sha256
          cp image/counter-runtime.patch receipts/
          qemu-system-i386 --version > receipts/qemu-version.txt
          qemu-system-i386 -trace help > receipts/trace-help.txt 2>&1
          printf '%s\n' virtqueue_pop virtqueue_fill > receipts/events
          for n in virtqueue_pop virtqueue_fill; do grep -Eq "^$n([[:space:]]|$)" receipts/trace-help.txt; done
      - name: Observe native VirtIO driver activation on original ISO
        run: |
          set -euo pipefail
          cat > receipts/run.py <<'PY'
          import subprocess,pathlib,socket,time,json,re,struct
          P=pathlib.Path; r=P('receipts')
          def pcap_counts(path):
              b=path.read_bytes()
              assert len(b)>=24,'missing pcap header'
              endian={b'\xd4\xc3\xb2\xa1':'<',b'\xa1\xb2\xc3\xd4':'>',b'\x4d\x3c\xb2\xa1':'<',b'\xa1\xb2\x3c\x4d':'>'}[b[:4]]
              assert struct.unpack_from(endian+'I',b,20)[0]==1
              i=24; total=0; tx=0
              while i<len(b):
                  assert i+16<=len(b)
                  _,_,n,_=struct.unpack_from(endian+'IIII',b,i);i+=16
                  assert i+n<=len(b)
                  f=b[i:i+n];i+=n;total+=1
                  if len(f)>=14 and f[6:12]==bytes.fromhex('525400123456'):tx+=1
              return total,tx
          def run(mode,enabled):
              disk=mode+'.qcow2';sock=mode+'.sock'
              subprocess.run(['qemu-img','create','-f','qcow2',disk,'4G'],check=True)
              argv=['qemu-system-i386','-accel','tcg','-m','512','-smp','1','-display','none','-vga','std','-monitor','none','-serial','file:receipts/'+mode+'.serial','-debugcon','file:receipts/'+mode+'.debugcon','-qmp','unix:'+sock+',server=on,wait=off','-no-reboot','-cdrom','image/counter-'+str(enabled)+'.iso','-boot','d','-drive','file='+disk+',if=ide','-netdev','user,id=n,restrict=on','-device','virtio-net-pci,id=nic0,netdev=n,romfile=,mac=52:54:00:12:34:56,packed=off,disable-legacy=on','-object','filter-dump,id=cap,netdev=n,file=receipts/'+mode+'.pcap','-trace','events=receipts/events','-D','receipts/'+mode+'.trace']
              (r/(mode+'-argv.json')).write_text(json.dumps(argv,indent=2))
              history=[];snapshots=[];p=None;error=None
              with (r/(mode+'.qemu.log')).open('wb') as out:
                  p=subprocess.Popen(argv,stdout=out,stderr=out)
                  try:
                      for _ in range(100):
                          if P(sock).exists():break
                          assert p.poll() is None
                          time.sleep(.1)
                      with socket.socket(socket.AF_UNIX) as s:
                          s.settimeout(15);s.connect(sock);f=s.makefile('rwb')
                          assert 'QMP' in json.loads(f.readline())
                          def qmp(cmd,args=None,required=True):
                              req={'execute':cmd,'id':len(history)}
                              if args is not None:req['arguments']=args
                              f.write(json.dumps(req).encode()+b'\n');f.flush()
                              while True:
                                  line=f.readline();assert line
                                  obj=json.loads(line)
                                  if obj.get('id')==req['id']:
                                      history.append({'request':req,'response':obj})
                                      if required:assert 'return' in obj,obj
                                      return obj.get('return')
                          qmp('qmp_capabilities')
                          cmds={c['name'] for c in qmp('query-commands')}
                          start=time.monotonic()
                          for sec,key in [(120,'n'),(150,'l'),(180,None),(240,None)]:
                              time.sleep(max(0,sec-(time.monotonic()-start)))
                              qmp('query-status')
                              qmp('screendump',{'filename':str((r/f'{mode}-{sec}.ppm').resolve())})
                              status=[]
                              if 'x-query-virtio' in cmds and 'x-query-virtio-status' in cmds:
                                  for dev in qmp('x-query-virtio'):
                                      state=qmp('x-query-virtio-status',{'path':dev['path']},required=False)
                                      if state is not None and dev['path']=='/machine/peripheral/nic0/virtio-backend':status.append({'device':dev,'state':state})
                              snapshots.append({'second':sec,'virtio':status})
                              # English resource accelerators: Next, then Run Live CD.
                              # These are bounded UI actions on a disposable guest, not a proof of screen state.
                              if key:qmp('send-key',{'keys':[{'type':'qcode','data':'alt'},{'type':'qcode','data':key}],'hold-time':100})
                          qmp('quit')
                  except Exception as e:
                      error=repr(e)
                  finally:
                      if p.poll() is None:
                          try:p.wait(timeout=10)
                          except subprocess.TimeoutExpired:p.kill();p.wait()
                      (r/(mode+'-qmp.json')).write_text(json.dumps(history,indent=2))
              (r/(mode+'-status.json')).write_text(json.dumps(snapshots,indent=2))
              ready=any('DRIVER_OK' in json.dumps(d['state'].get('status',{})) for x in snapshots for d in x['virtio'])
              t=(r/(mode+'.trace')).read_text(errors='replace')
              raw=(r/(mode+'.serial')).read_bytes()
              total,tx=pcap_counts(r/(mode+'.pcap'))
              row={'mode':mode,'error':error,'driver_ok':ready,'frames':total,'guest_tx_frames':tx,'pop':len(re.findall(r'\bvirtqueue_pop\b',t)),'fill':len(re.findall(r'\bvirtqueue_fill\b',t)),'guest_submit_markers':raw.count(b'OBS submit'),'guest_consume_markers':raw.count(b'OBS consume'),'kernel_banner':b'ReactOS 0.4.17' in raw}
              debug=(r/(mode+'.debugcon')).read_bytes()
              records=[]
              for m in re.finditer(b"RDTEVC01",debug):
                  assert m.end()+20<=len(debug),"truncated fixture record"
                  records.append(struct.unpack_from("<IIIII",debug,m.end()))
              unique=sorted(set(records))
              counter_ok=len(unique)==1 and unique[0][0]==1 and unique[0][1]==enabled and unique[0][3]==0 and unique[0][4]>0 and unique[0][2]==(unique[0][4] if enabled else 0)
              row.update(requested_enabled=enabled,raw_counter_witness_count=len(records),unique_counter_witnesses=unique,counter_ok=counter_ok)
              row['activation_witness']=error is None and ready and tx>0 and row['pop']>0 and row['fill']>0 and counter_ok
              (r/(mode+'-summary.json')).write_text(json.dumps(row,indent=2))
              return row
          rows=[]
          for mode,enabled in [('off',0),('on',1)]:
              try:rows.append(run(mode,enabled))
              except Exception as e:rows.append({'mode':mode,'error':repr(e),'activation_witness':False})
              (r/'summary.json').write_text(json.dumps(rows,indent=2))
          assert len(rows)==2 and all(x['activation_witness'] for x in rows),rows
          assert rows[0]['unique_counter_witnesses'][0][4]==rows[1]['unique_counter_witnesses'][0][4],rows
          PY
          python3 receipts/run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: virtio-reactos-v20c5
          path: receipts/
          retention-days: 7
      - name: Bind terminal receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          test "$GITHUB_REPOSITORY" = SemperSupra/WineBot
          test "$GITHUB_REF" = refs/heads/rdte/reactos-source-boot-20261123
          case "$RESULT" in success|failure) state="$RESULT";; *) state=error;; esac
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$state" -f context=rdte/virtio-reactos-v20c5 -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
