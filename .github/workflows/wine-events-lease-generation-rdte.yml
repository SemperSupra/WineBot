name: WineBot lease generation synthetic RDTE
on:
  push:
    branches:
      - qualification/wine-events-lease-authority-20261027
permissions:
  contents: read
jobs:
  lease-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Validate isolated authority and cursor
        run: |
          set -euo pipefail
          python3 -m compileall -q rdte/wine11/lease_generation_authority_rdte.py tests/test_wine_lease_generation_authority_rdte.py
          python3 -m unittest discover -s tests -p 'test_wine_lease_generation_authority_rdte.py' -q
          python3 -m unittest discover -s tests -p 'test_wine_generation_cursor_rdte.py' -q
