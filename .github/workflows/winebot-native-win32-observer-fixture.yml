name: winebot-native-win32-observer-fixture

# Isolated RDTE only. No production code, image, artifact or release publication.
on:
  push:
    branches:
      - qualification/native-win32-observer-fixture-20261031
      - qualification/native-winspect-bridge-joined-20261103
    paths:
      - tests/portable_win32_native_rdte/**
      - .github/workflows/winebot-native-win32-observer-fixture.yml

permissions:
  contents: read

jobs:
  native-synthetic-fixture:
    runs-on: windows-2022
    env:
      WINEBOT_OBSERVER_SAFE_RECEIPT: ${{ runner.temp }}\native-observer-safe.jsonl
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Compile existing observer and synthetic fixture under native MSVC
        shell: pwsh
        run: |
          cmake -S tests/portable_win32_native_rdte -B rdte-native-build -G "Visual Studio 17 2022" -A "${{ matrix.arch }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build rdte-native-build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.24'
          cache: false
      - name: Execute native Windows event observation and bounded shutdown
        shell: pwsh
        run: |
          python tests/portable_win32_native_rdte/probe.py rdte-native-build/Release/win_event_observer.exe rdte-native-build/Release/win_event_fixture.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Consume actual WinEvent records with portable read-only bridge
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:WINEBOT_OBSERVER_SAFE_RECEIPT -PathType Leaf)) {
            throw 'Native producer record missing.'
          }
          Push-Location tests/portable_observer_contract
          try {
            go test -race -count=1 -run '^TestRealNativeWinEventProducerThroughPortableWinInspectBridge$' ./...
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - name: Disposition
        if: always()
        shell: pwsh
        run: |
          Write-Output "Synthetic native Windows RDTE only; hosted runner GUI accessibility is environment-dependent."
          Write-Output "No artifact uploads, screenshots, packaged binaries, source promotion or application injection."
