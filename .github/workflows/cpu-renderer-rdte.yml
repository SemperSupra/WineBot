name: CPU Software Renderer RDTE (synthetic)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/cpu_renderer.py
      - tests/test_cpu_renderer.py
      - docker/cpu-renderers.Dockerfile
      - tests/fixtures/cpu_gl_smoke.c
      - .github/workflows/cpu-renderer-rdte.yml
permissions:
  contents: read
concurrency:
  group: cpu-rdte-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-software-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Pure synthetic unit tests
        run: python3 -m unittest discover -s tests -p 'test_cpu_renderer.py' -v
      - name: Build isolated Debian Mesa image (no WineBot base or private assets)
        run: docker build -f docker/cpu-renderers.Dockerfile -t winebot-cpu-rdte:synthetic .
      - name: LLVMpipe GLX probe (bounded)
        timeout-minutes: 2
        run: |
          echo 'BEGIN: CPU OpenGL renderer identity'
          timeout -k 10s 75s docker run --rm --init --network none --entrypoint /usr/bin/xvfb-run winebot-cpu-rdte:synthetic \
            -a -s '-screen 0 640x480x24 +extension GLX -nolisten tcp' \
            python3 /opt/winebot/cpu_renderer.py probe --profile cpu-opengl-llvmpipe --timeout 20
          echo 'PASS: CPU OpenGL renderer identity'
      - name: LLVMpipe GLX draw smoke (bounded)
        timeout-minutes: 2
        run: |
          echo 'BEGIN: CPU OpenGL draw'
          timeout -k 10s 75s docker run --rm --init --network none --entrypoint /usr/bin/xvfb-run winebot-cpu-rdte:synthetic \
            -a -s '-screen 0 640x480x24 +extension GLX -nolisten tcp' \
            python3 /opt/winebot/cpu_renderer.py benchmark --profile cpu-opengl-llvmpipe --seconds 7 --timeout 20
          echo 'PASS: CPU OpenGL draw'
      - name: Lavapipe Vulkan probe (bounded)
        timeout-minutes: 2
        run: |
          echo 'BEGIN: CPU Vulkan renderer identity'
          timeout -k 10s 75s docker run --rm --init --network none --entrypoint /usr/bin/xvfb-run winebot-cpu-rdte:synthetic \
            -a -s '-screen 0 640x480x24 +extension GLX -nolisten tcp' \
            python3 /opt/winebot/cpu_renderer.py probe --profile cpu-vulkan-lavapipe --timeout 20
          echo 'PASS: CPU Vulkan renderer identity'
      - name: Lavapipe Vulkan draw smoke (bounded)
        timeout-minutes: 2
        run: |
          echo 'BEGIN: CPU Vulkan draw'
          timeout -k 10s 75s docker run --rm --init --network none --entrypoint /usr/bin/xvfb-run winebot-cpu-rdte:synthetic \
            -a -s '-screen 0 640x480x24 +extension GLX -nolisten tcp' \
            python3 /opt/winebot/cpu_renderer.py benchmark --profile cpu-vulkan-lavapipe --frames 20 --timeout 45
          echo 'PASS: CPU Vulkan draw'
      # SwiftShader is deliberately NOT silently substituted or fetched from
      # a floating release. A separately pinned, licensed ICD is needed.
      # No artifact upload: keep public evidence generic and bounded.

  synthetic-wine-opengl:
    name: Derived WineBot Win32 WGL smoke (synthetic)
    needs: synthetic-software-rendering
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Compile tiny Win32 OpenGL fixture on public runner
        run: |
          docker build -f docker/Dockerfile --target hook-dll-builder -t winebot:rdte-mingw .
          docker run --rm --network none --entrypoint x86_64-w64-mingw32-gcc \
            -v "$PWD/tests/fixtures/cpu_gl_smoke.c:/src.c:ro" \
            -v /tmp:/output winebot:rdte-mingw -O2 -o /output/winebot-cpu-gl-smoke.exe \
            /src.c -lopengl32 -lgdi32 -luser32
      - name: Build qualified WineBot candidate and opt-in CPU rendering layer
        run: |
          docker build -f docker/Dockerfile --target intent-slim -t winebot:rdte-slim .
          docker build -f docker/cpu-renderers.Dockerfile \
            --build-arg BASE_IMAGE=winebot:rdte-slim -t winebot:rdte-cpu .
      - name: WGL 15-point geometry/fill and thread matrix (bounded)
        timeout-minutes: 7
        run: |
          for threads in 1 2 4; do
            for config in "1 1 320 0" "20 128 640 0" "25 1024 960 0" "8 8 640 1" "4 32 960 1"; do
            read -r frames triangles width fill <<< "$config"
            if timeout -k 10s 85s docker run --rm --init --network none \
              --cpus=2 --memory=3g --pids-limit=256 \
              -e WINEDEBUG=-all \
              -e WINEPREFIX=/tmp/winebot-fixture-prefix \
              -v /tmp/winebot-cpu-gl-smoke.exe:/fixture.exe:ro \
              --entrypoint /usr/bin/xvfb-run winebot:rdte-cpu \
              -a -s '-screen 0 1280x960x24 +extension GLX -nolisten tcp' \
              python3 /opt/winebot/cpu_renderer.py exec \
              --profile cpu-opengl-llvmpipe --threads "$threads" -- \
              wine /fixture.exe "$frames" "$triangles" "$width" "$fill" \
              > /tmp/winebot-wgl-job-local.log 2>&1; then
                :
            else
                rc=$?
                echo "UNQUALIFIED: Windows/WGL draw exit_class=$rc"
                exit 2
            fi
            if ! grep -Fq "WINE_OPENGL_LLVMPIPE_OK frames=$frames triangles=$triangles width=$width fill=$fill" \
              /tmp/winebot-wgl-job-local.log; then
                echo 'UNQUALIFIED: Windows/WGL success identity mismatch'
                exit 2
            fi
            draw_us="$(grep -Eo 'elapsed_us=[0-9]{1,10}' /tmp/winebot-wgl-job-local.log | tail -1 | cut -d= -f2)"
            if [[ ! "$draw_us" =~ ^[0-9]{1,10}$ ]]; then
              echo 'UNQUALIFIED: Windows/WGL elapsed timing unavailable'
              exit 2
            fi
            echo "PASS: Windows/WGL threads=$threads frames=$frames triangles=$triangles width=$width fill=$fill elapsed_us=$draw_us"
            done
          done
          # Raw Wine stdout/stderr remains job-local and is never uploaded.
