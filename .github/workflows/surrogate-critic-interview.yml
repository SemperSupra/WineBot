name: Reversing observatory public-safe CPU critic interviews
on:
  pull_request:
    paths:
      - '.github/workflows/surrogate-critic-interview.yml'
      - 'qualification/surrogates/freeciv/critics/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reversing-critic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  critic-interview:
    name: Source-neutral ${{ matrix.task_class }} CPU interview
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        task_class: [reasoning, vision, audio]
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_XET: '1'
      TRANSFORMERS_NO_TF: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - name: Checkout public workcell with no persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Deterministic admission and red-team tests
        run: |
          set -euo pipefail
          python3 qualification/surrogates/freeciv/critics/test_interview.py -v
          python3 -m py_compile qualification/surrogates/freeciv/critics/interview.py
      - name: Install CPU-only inference runtime and optional speech synthesizer
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-cache-dir --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0'
          python3 -m pip install --disable-pip-version-check --no-cache-dir \
            'transformers==4.56.2' 'huggingface_hub==0.35.3' \
            'Pillow==11.3.0' 'numpy==2.1.3' 'soundfile==0.13.1' 'scipy==1.15.3'
          if [ '${{ matrix.task_class }}' = audio ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends espeak-ng
          fi
      - name: Run actual open-weight model on bounded generated fixtures
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/public-critic"
          timeout 800s python3 qualification/surrogates/freeciv/critics/interview.py \
            --class '${{ matrix.task_class }}' \
            --output "$RUNNER_TEMP/public-critic/critic-${{ matrix.task_class }}.json"
      - name: Upload allowlisted critic interview receipt only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-observatory-critic-${{ matrix.task_class }}
          path: ${{ runner.temp }}/public-critic/*.json
          if-no-files-found: ignore
          retention-days: 3
