name: winebot-native-target-class-collision-rdte
# Controlled synthetic-only Win32 class name collision proof.
# The expected result is an admitted observer event, NOT trusted identity.
on:
  push:
    branches:
      - qualification/native-class-spoof-proof-20261102
    paths:
      - rdte/wine11/win_event_class_collision.c
      - tests/portable_win32_native_rdte/probe_class_collision.py
      - .github/workflows/winebot-native-target-class-collision-rdte.yml
permissions:
  contents: read
jobs:
  class-only-provenance-negative:
    runs-on: windows-2022
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build independent same-class process and observer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) {throw 'no_compiler'}
          $arch = '${{ matrix.arch }}'
          $vcvars = Join-Path $vs ('VC/Auxiliary/Build/vcvars' + $(if ($arch -eq 'x86') {'32'} else {'64'}) + '.bat')
          New-Item -ItemType Directory -Path rdte-bin -Force | Out-Null
          $commands = 'call "' + $vcvars + '" >nul && cl /nologo /W3 /O2 /Fe:rdte-bin/win_event_target_probe.exe rdte/wine11/win_event_target_probe.c user32.lib && cl /nologo /W3 /O2 /Fe:rdte-bin/win_event_fixture.exe rdte/wine11/win_event_fixture.c user32.lib && cl /nologo /W3 /O2 /Fe:rdte-bin/win_event_class_collision.exe rdte/wine11/win_event_class_collision.c user32.lib'
          & cmd.exe /d /s /c $commands
          if ($LASTEXITCODE -ne 0) {throw 'native_compile_failed'}
      - name: Demonstrate class-only source identity is insufficient
        shell: pwsh
        run: |
          python tests/portable_win32_native_rdte/probe_class_collision.py rdte-bin/win_event_target_probe.exe rdte-bin/win_event_fixture.exe rdte-bin/win_event_class_collision.exe
          if ($LASTEXITCODE -ne 0) {throw 'class_collision_falsification_failed'}
      - name: Explicit nonpromotion
        if: always()
        run: echo 'Expected counterexample. Class-name/WinEvent fixture epoch is not a trusted issuer or input authorization. No binaries uploaded.'
