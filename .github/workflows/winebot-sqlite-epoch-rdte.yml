name: WineBot persisted epoch transaction qualification
on:
  push:
    branches:
      - qualification/epoch-persistence-sqlite-20261028
permissions:
  contents: read
jobs:
  sqlite-epoch:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_wine_sqlite_epoch_store_rdte.py' -q
