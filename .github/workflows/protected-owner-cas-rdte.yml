name: Protected Owner CAS Offline RDTE

on:
  pull_request:
    paths:
      - 'rdte/protected-control/**'
      - '.github/workflows/protected-owner-cas-rdte.yml'

permissions:
  contents: read

concurrency:
  group: protected-owner-cas-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline-go:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact untrusted public PR source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile and run strict synthetic control-owner cases
        shell: bash
        run: |
          set -euo pipefail
          GO111MODULE=off go vet ./rdte/protected-control
          GO111MODULE=off go test -race -count=1 ./rdte/protected-control
          GO111MODULE=off go build -o "$RUNNER_TEMP/winebot-protected-owner" ./rdte/protected-control
          test -x "$RUNNER_TEMP/winebot-protected-owner"
          echo 'PROTECTED_OWNER_RDTE=PASS'
