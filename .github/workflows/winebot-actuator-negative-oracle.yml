name: winebot-actuator-negative-oracle
on:
  push:
    branches:
      - qualification/actuator-authorization-oracle-20261031
permissions:
  contents: read
jobs:
  synthetic-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.24'
          cache: false
      - name: Offline contract and actuator-negative oracle
        working-directory: tests/portable_observer_contract
        run: go test -count=1 -race ./...
      - name: Custody
        if: always()
        run: echo 'No real actuators or platform control. Synthetic test-only authorization predicate.'
