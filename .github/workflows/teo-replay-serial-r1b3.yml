name: Linux TCG external serial replay R1b3
on:
  push:
    branches: [rdte/synthetic-analysis-b05-20261125]
    paths: [.github/workflows/teo-replay-serial-r1b3.yml]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Prepare public kernel and original guest fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p receipts root/bin
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 busybox-static cpio
          qemu-system-x86_64 --version > receipts/qemu-version.txt
          dpkg-query -W qemu-system-x86 busybox-static cpio > receipts/packages.txt
          sha256sum "$(command -v qemu-system-x86_64)" > receipts/qemu.sha256
          curl -fL --retry 2 --max-time 90 https://storage.tuxboot.com/buildroot/20241119/x86_64/bzImage -o kernel
          echo 'f57bfc6553bcd6e0a54aab86095bf642b33b5571d14e3af1731b18c87ed5aef8  kernel' | sha256sum -c -
          cp "$(command -v busybox)" root/bin/busybox
          cp /dev/null receipts/init
          cat > receipts/init <<'SH'
          #!/bin/busybox sh
          set -e
          export PATH=/bin
          test -c /dev/ttyS0
          exec 3</dev/ttyS0
          /bin/busybox stty -F /dev/ttyS0 raw -echo
          echo TEO_READY
          IFS= read -r line <&3 || exit 1
          echo TEO_BEGIN
          /bin/busybox printf '%s\n' "$line" | /bin/busybox sha256sum
          echo TEO_END
          /bin/busybox poweroff -f
          SH
          cp receipts/init root/init
          chmod 755 root/init
          mkdir -p root/dev root/proc root/sys
          sudo mknod root/dev/console c 5 1
          sudo mknod root/dev/null c 1 3
          sudo mknod root/dev/ttyS0 c 4 64
          (cd root && find . -print0 | LC_ALL=C sort -z | sudo cpio --null -o -H newc --owner=0:0 --reproducible) > initramfs
          sha256sum kernel initramfs receipts/init root/bin/busybox > receipts/inputs.sha256
      - name: Compare ordinary TCG with recorded input via stdio
        run: |
          set -euo pipefail
          cat > receipts/drive.py <<'PY'
          import hashlib,json,os,pathlib,selectors,subprocess,time
          p=pathlib.Path("receipts")
          base=["qemu-system-x86_64","-machine","q35","-cpu","Nehalem","-accel","tcg,thread=single","-smp","1","-m","256","-display","none","-monitor","none","-nic","none","-no-reboot","-kernel","kernel","-initrd","initramfs","-append","console=ttyS0 rdinit=/init panic=-1 nokaslr","-serial","stdio"]
          def run(name,mode,token,rr=None):
              args=base.copy()
              if mode!="control": args+=["-icount",f"shift=5,rr={mode},rrfile={rr}"]
              start=time.monotonic()
              event=p/f"{name}.events.jsonl"
              def emit(kind,**kw):
                  with event.open("a") as f: f.write(json.dumps({"kind":kind,"elapsed":time.monotonic()-start,**kw})+"\n")
              with (p/f"{name}.stderr").open("wb") as err,(p/f"{name}.serial").open("wb") as out:
                  proc=subprocess.Popen(args,stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=err,bufsize=0)
                  try:
                      with selectors.DefaultSelector() as sel:
                          sel.register(proc.stdout,selectors.EVENT_READ)
                          seen=b""; sent=False
                          deadline=start+45
                          while time.monotonic()<deadline:
                              for key,_ in sel.select(.2):
                                  data=os.read(key.fd,65536)
                                  if not data:
                                      sel.unregister(key.fileobj); break
                                  out.write(data);out.flush()
                                  seen=(seen+data)[-65536:]
                                  if not sent and token is not None and b"TEO_READY" in seen:
                                      emit("ready")
                                      for b in token:
                                          n=os.write(proc.stdin.fileno(),bytes([b]))
                                          assert n==1
                                          emit("host_write",byte=b,count=n)
                                          time.sleep(.02)
                                      sent=True
                              if proc.poll() is not None and not sel.get_map(): break
                          if proc.poll() is None: raise TimeoutError(name)
                          emit("exit",code=proc.returncode)
                          assert proc.returncode==0
                          assert token is None or sent
                  finally:
                      if proc.poll() is None: proc.kill();proc.wait()
              emit("complete")
          failures=[]
          for name,mode,token,rr in [("control","control",b"public-input-alpha\n",None),("a","record",b"public-input-alpha\n",p/"a.rr"),("b","record",b"public-input-bravo\n",p/"b.rr")]:
              try:
                  run(name,mode,token,rr)
                  if rr:
                      before=hashlib.sha256(rr.read_bytes()).hexdigest()
                      run(name+"-replay","replay",None,rr)
                      assert before==hashlib.sha256(rr.read_bytes()).hexdigest()
              except Exception as e: failures.append([name,repr(e)])
          (p/"failures.json").write_text(json.dumps(failures,indent=2))
          PY
          python3 receipts/drive.py
      - name: Score control and recorded input independently
        run: |
          set -euo pipefail
          cat > receipts/score.py <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("receipts"); results={}
          alpha=b"public-input-alpha\n"; bravo=b"public-input-bravo\n"
          def check(data,t):
              lines=data.splitlines(); h=hashlib.sha256(t).hexdigest().encode()
              return all(lines.count(x)==1 for x in (b"TEO_READY",b"TEO_BEGIN",b"TEO_END")) and lines.index(b"TEO_READY")<lines.index(b"TEO_BEGIN") and lines.index(b"TEO_END")==lines.index(b"TEO_BEGIN")+2 and lines[lines.index(b"TEO_BEGIN")+1].split()==[h,b"-"] and b"reboot: Power down" in data
          for name,t in [("control",alpha),("a",alpha),("a-replay",alpha),("b",bravo),("b-replay",bravo)]:
              f=p/f"{name}.serial"; e=p/f"{name}.events.jsonl"
              data=f.read_bytes() if f.exists() else b""
              rows=[json.loads(x) for x in e.read_text().splitlines()] if e.exists() else []
              written=bytes(x["byte"] for x in rows if x["kind"]=="host_write" and x["count"]==1)
              results[name]={"guest":check(data,t),"wrong_refused":not check(data,bravo if t==alpha else alpha),"host_write_ok":written==(b"" if "replay" in name else t),"exit_ok":any(x.get("kind")=="exit" and x.get("code")==0 for x in rows)}
          (p/"scores.json").write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          assert not json.loads((p/"failures.json").read_text())
          assert all(all(x.values()) for x in results.values())
          assert (p/"a.rr").read_bytes()!=(p/"b.rr").read_bytes()
          PY
          python3 receipts/score.py
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-tcg-serial-replay-r1b3
          path: receipts/
          retention-days: 7
