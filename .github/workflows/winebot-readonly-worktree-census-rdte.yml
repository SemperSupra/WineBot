name: winebot-readonly-worktree-census-rdte
# Synthetic self-tests only. Never enumerate the runner workspace or user/local checkouts.
on:
  push:
    branches:
      - qualification/read-only-worktree-census-20261102
    paths:
      - tools/worktree-census/**
      - .github/workflows/winebot-readonly-worktree-census-rdte.yml
permissions:
  contents: read
jobs:
  synthetic-worktree-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.24'
          cache: false
      - name: Run synthetic temporary-worktree privacy and no-mutation oracle
        working-directory: tools/worktree-census
        run: go test -race -count=1 ./...
      - name: Scope
        if: always()
        run: echo 'No real local worktrees or actor locks inspected, no cleanup or uploads; local deployment and pruning require separate authorization.'
